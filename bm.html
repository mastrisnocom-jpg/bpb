<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00529C">
    <meta name="description" content="Portal Enterprise Banking & Facility Management System">
    <title>Portal Sistem Terpadu - Mobile Banking & Facility Management</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & CSS VARIABLES
           ========================================================================== */
        :root {
            --primary: #00529C;
            --primary-dark: #003B73;
            --primary-light: #E6F0FA;
            --primary-glow: rgba(0, 82, 156, 0.25);
            
            --btn-transfer: #3B82F6;
            --btn-bayar: #8B5CF6;
            --btn-beli: #10B981;
            --btn-properti: #EC4899;
            --btn-poin: #F43F5E;
            --btn-cardless: #14B8A6;
            --btn-lifestyle: #8B5CF6;
            --btn-semua: #3B82F6;
            
            --bg-body: #F4F7FC;
            --bg-card: #FFFFFF;
            --bg-header: rgba(255, 255, 255, 0.95);
            --bg-sidebar: #FFFFFF;
            --bg-hover: #F8FAFC;
            --border-color: #E2E8F0;
            --border-light: rgba(255, 255, 255, 0.8);

            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --shadow-lg: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            --shadow-bottom-nav: 0 -4px 25px rgba(0, 0, 0, 0.06);

            --sidebar-width: 260px;
            --sidebar-width-collapsed: 80px;
            --header-height: 70px;
            --bottom-nav-height: 74px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-pill: 9999px;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #090D16;
            --bg-card: #131B2E;
            --bg-header: rgba(19, 27, 46, 0.92);
            --bg-sidebar: #101726;
            --bg-hover: #1E293B;
            --border-color: #1E293B;
            --border-light: rgba(255, 255, 255, 0.05);

            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-light: #64748B;

            --primary-light: rgba(0, 82, 156, 0.2);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.5);
            --shadow-lg: 0 20px 35px -10px rgba(0,0,0,0.7);
            --shadow-bottom-nav: 0 -4px 25px rgba(0,0,0,0.6);
        }

        /* ==========================================================================
           2. BASE RESETS & TYPOGRAPHY
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            border: none;
            outline: none;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
        }

        /* ==========================================================================
           3. APP HEADER
           ========================================================================== */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--bg-header);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            transition: var(--transition-smooth);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
            cursor: pointer;
        }

        .brand-badge {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
        }

        .header-search {
            position: relative;
            margin-left: 1.5rem;
            display: none;
        }

        .header-search input {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 0.55rem 1rem 0.55rem 2.4rem;
            border-radius: var(--radius-pill);
            color: var(--text-main);
            font-size: 0.85rem;
            width: 240px;
            transition: var(--transition-smooth);
        }

        .header-search input:focus {
            width: 300px;
            background: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .header-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        .header-center {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .live-clock {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .live-date {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background: var(--bg-hover);
            transition: var(--transition-smooth);
            position: relative;
        }

        .icon-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: #EF4444;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }

        .user-dropdown-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0.6rem 0.3rem 0.3rem;
            border-radius: var(--radius-pill);
            background: var(--bg-hover);
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        /* ==========================================================================
           4. APP LAYOUT (SIDEBAR & MAIN CONTENT)
           ========================================================================== */
        .app-shell {
            display: flex;
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
        }

        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem 0.75rem;
            z-index: 900;
            transition: var(--transition-smooth);
            overflow-y: auto;
        }

        .sidebar-menu-title {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-light);
            padding: 0.5rem 0.75rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.7rem 0.85rem;
            border-radius: 12px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .nav-item a svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .nav-item.active a, .nav-item a:hover {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .app-main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 1.5rem;
            padding-bottom: calc(var(--bottom-nav-height) + 2rem);
            min-height: calc(100vh - var(--header-height));
            transition: var(--transition-smooth);
        }

        /* ==========================================================================
           5. EXACT MOBILE BANKING UI (SESUAI GAMBAR)
           ========================================================================== */
        .portal-mobile-container {
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* 8 Icon Grid Card */
        .grid-icon-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .grid-icon-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem 0.5rem;
        }

        .menu-item-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            user-select: none;
        }

        .menu-item-btn:hover {
            transform: translateY(-3px);
        }

        .circle-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            margin-bottom: 0.5rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            transition: var(--transition-smooth);
        }

        .circle-icon svg {
            width: 26px;
            height: 26px;
        }

        .menu-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        /* DompetKu Section */
        .wallet-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .card-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .link-action {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
        }

        .link-action-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
        }

        .dana-box {
            background: #EBF3FF;
            border-radius: var(--radius-md);
            padding: 1.1rem 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            border: 1px solid rgba(0, 82, 156, 0.08);
        }

        .dana-btn {
            background: var(--primary);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.45rem 1.4rem;
            border-radius: var(--radius-pill);
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .promo-box {
            background: linear-gradient(135deg, #4F86F7 0%, #2563EB 100%);
            border-radius: var(--radius-md);
            padding: 0.85rem;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .promo-box h4 {
            font-size: 0.8rem;
            font-weight: 800;
            line-height: 1.3;
        }

        .promo-badge {
            background: #fff;
            color: #2563EB;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            display: inline-block;
            margin-top: 0.4rem;
            width: fit-content;
        }

        /* Transfer Terakhir Section */
        .history-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        .history-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .history-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
        }

        .history-info h5 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.15rem;
        }

        .history-info p {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .history-amount {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: right;
        }

        /* ==========================================================================
           6. BOTTOM NAVIGATION (EXACT SESUAI GAMBAR DENGAN TOMBOL QRIS TENGAH)
           ========================================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 0 0.5rem;
            z-index: 1000;
            box-shadow: var(--shadow-bottom-nav);
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            flex: 1;
            padding: 6px 0;
            transition: var(--transition-smooth);
        }

        .bottom-nav-item svg {
            width: 24px;
            height: 24px;
        }

        .bottom-nav-item.active {
            color: var(--primary);
        }

        .nav-qris-wrap {
            position: relative;
            top: -18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .btn-qris-center {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 8px 20px var(--primary-glow);
            border: 4px solid var(--bg-card);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-qris-center:hover {
            transform: scale(1.06);
        }

        .btn-qris-center svg {
            width: 26px;
            height: 26px;
        }

        .qris-subtext {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* ==========================================================================
           7. GAS IFRAME VIEW & MODAL
           ========================================================================== */
        .portal-iframe-container {
            width: 100%;
            height: calc(100vh - var(--header-height) - 90px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }

        .portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .app-footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            min-width: 280px;
            background: var(--bg-card);
            color: var(--text-main);
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            animation: slideInRight 0.3s forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal View */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-card {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Responsive Breakpoints */
        @media (min-width: 992px) {
            .header-search { display: block; }
            .header-center { display: flex; }
        }

        @media (max-width: 991px) {
            .app-sidebar { width: var(--sidebar-width-collapsed); }
            .sidebar-menu-title, .nav-item span { display: none; }
            .app-main-content { margin-left: var(--sidebar-width-collapsed); }
        }

        @media (max-width: 767px) {
            .app-sidebar { display: none; }
            .bottom-nav { display: flex; }
            .app-main-content { margin-left: 0; padding: 1rem; padding-bottom: calc(var(--bottom-nav-height) + 1.5rem); }
            .app-footer { margin-bottom: var(--bottom-nav-height); }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         TOP HEADER BAR
         ========================================================================== -->
    <header class="app-header">
        <div class="header-left">
            <div class="brand-logo" onclick="Router.navigate('beranda')">
                <div class="brand-badge">B</div>
                <span>Portal BM</span>
            </div>

            <div class="header-search">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path></svg>
                <input type="text" placeholder="Cari transaksi, modul BM..." onkeyup="App.handleSearch(this.value)">
            </div>
        </div>

        <div class="header-center">
            <div class="live-clock" id="clock">00:00:00 WIB</div>
            <div class="live-date" id="date">Hari, 00 Bulan 2026</div>
        </div>

        <div class="header-right">
            <button class="icon-btn" onclick="App.toggleFullscreen()" title="Fullscreen" aria-label="Fullscreen">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"></path></svg>
            </button>
            <button class="icon-btn" id="themeToggleBtn" onclick="Theme.toggle()" title="Toggle Tema" aria-label="Theme Switch">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path></svg>

                                        <div class="history-icon-circle" style="background: #8B5CF6;">
                                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21L3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"></path></svg>
                                        </div>
                                        <div class="history-info">
                                            <h5>DENDI ADI WIJAYA</h5>
                                            <p>Sesama BTN • 0000 2015 0150 1032</p>
                                        </div>
                                    </div>
                                    <div class="history-amount">-Rp 90.000</div>
                                </div>

                                <!-- 3. Sutrisno -->
                                <div class="history-item">
                                    <div class="history-left">
                                        <div class="history-icon-circle" style="background: #14B8A6;">
                                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.333A48.374 48.374 0 0012 9.75c-2.551 0-5.056.2-7.5.583V21"></path></svg>
                                        </div>
                                        <div class="history-info">
                                            <h5>SUTRISNO</h5>
                                            <p>BI FAST BANK MANDIRI • 1350 0097 0335 4</p>
                                        </div>
                                    </div>
                                    <div class="history-amount">-Rp 3.000.000</div>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            },
            viewGAS(menu) {
                return `
                    <div style="margin-bottom: 1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                        <div>
                            <h2 style="font-size:1.3rem; font-weight:800;">${menu.title}</h2>
                            <p style="font-size:0.8rem; color:var(--text-muted);">Terhubung Google Apps Script Enterprise Workspace</p>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <a href="${menu.url}" target="_blank" class="dana-btn" style="width:auto; padding:0.5rem 1rem;">Tab Baru ↗</a>
                            <button class="dana-btn" style="width:auto; background:var(--text-muted);" onclick="Router.navigate('beranda')">Kembali</button>
                        </div>
                    </div>
                    <div class="portal-iframe-container">
                        <iframe src="${menu.url}" class="portal-iframe" allowfullscreen loading="lazy"></iframe>
                    </div>
                `;
            },
            viewArusKas() {
                return `
                    <div class="portal-mobile-container">
                        <div class="history-card">
                            <h3 style="font-size:1.1rem; font-weight:800; margin-bottom:1rem;">Ringkasan Arus Kas Operasional</h3>
                            <div style="padding:1rem; background:var(--bg-hover); border-radius:var(--radius-md); margin-bottom:1rem;">
                                <p style="font-size:0.8rem; color:var(--text-muted);">Total Pengeluaran Bulan Ini</p>
                                <h2 style="color:var(--primary); font-weight:800;">Rp 3.200.000</h2>
                            </div>
                            <button class="dana-btn" style="width:100%;" onclick="App.showToast('Laporan diunduh', 'success')">Download Laporan PDF</button>
                        </div>
                    </div>
                `;
            },
            viewProfile() {
                return `
                    <div class="portal-mobile-container">
                        <div class="wallet-card" style="text-align:center;">
                            <div class="user-avatar" style="width:70px; height:70px; margin:0 auto 1rem; font-size:1.6rem;">S</div>
                            <h3 style="font-weight:800;">SUTRISNO</h3>
                            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1.5rem;">Unit Leader Building Management</p>
                            <div style="text-align:left; font-size:0.85rem; display:flex; flex-direction:column; gap:0.75rem; background:var(--bg-hover); padding:1rem; border-radius:var(--radius-md);">
                                <div><strong>ID Pegawai:</strong> BM-2026-901</div>
                                <div><strong>Unit Kerja:</strong> KC Surabaya & Jawa Timur</div>
                                <div><strong>Akses Modul:</strong> 14 Modul Google Apps Script Terintegrasi</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        /**
         * 5. APPLICATION CONTROLLER
         */
        const App = {
            init() {
                Theme.init();
                Clock.init();
                this.renderSidebar();
                Router.init();
                document.getElementById('footerYear').innerText = new Date().getFullYear();
            },
            renderSidebar() {
                const list = document.getElementById('sidebarNavList');
                let html = `
                    <li class="nav-item active" data-route="beranda">
                        <a href="#/beranda">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"></path></svg>
                            <span>Beranda</span>
                        </a>
                    </li>
                `;

                GAS_MODULES.forEach(m => {
                    html += `
                        <li class="nav-item" data-route="${m.id}">
                            <a href="#/${m.id}">
                                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25a2.25 2.25 0 01-2.25-2.25V18z"></path></svg>
                                <span>${m.title}</span>
                            </a>
                        </li>
                    `;
                });

                list.innerHTML = html;
            },
            showToast(msg, type = 'info') {
                const con = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `<span>⚡</span><span>${msg}</span>`;
                con.appendChild(t);
                setTimeout(() => {
                    t.style.opacity = '0';
                    t.style.transform = 'translateX(100%)';
                    t.style.transition = 'all 0.3s ease';
                    setTimeout(() => t.remove(), 300);
                }, 2500);
            },
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            },
            openAllMenuModal() {
                const card = document.getElementById('modalCard');
                card.innerHTML = `
                    <h3 style="font-size:1.1rem; font-weight:800; margin-bottom:1rem;">Semua Modul Terhubung</h3>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; max-height:60vh; overflow-y:auto; padding-right:4px;">
                        ${GAS_MODULES.map(m => `
                            <button onclick="App.closeModalDirect(); Router.navigate('${m.id}')" style="text-align:left; padding:0.75rem; background:var(--bg-hover); border-radius:12px; font-size:0.8rem; font-weight:700;">
                                ${m.title}
                            </button>
                        `).join('')}
                    </div>
                `;
                document.getElementById('appModal').style.display = 'flex';
            },
            openQRISModal() {
                const card = document.getElementById('modalCard');
                card.innerHTML = `
                    <div style="text-align:center;">
                        <h3 style="font-size:1.15rem; font-weight:800; margin-bottom:0.5rem;">QRIS Pay & Scan</h3>
                        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1.5rem;">Pindai QR Code untuk pembayaran atau verifikasi checklist</p>
                        <div style="width:200px; height:200px; margin:0 auto 1.5rem; background:#fff; padding:10px; border-radius:16px; border:2px dashed var(--primary); display:flex; align-items:center; justify-content:center;">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PORTAL-BM-QRIS" style="width:100%;" alt="QRIS">
                        </div>
                        <button class="dana-btn" onclick="App.closeModalDirect()">Tutup Scanner</button>
                    </div>
                `;
                document.getElementById('appModal').style.display = 'flex';
            },
            closeModal(e) {
                if (e.target.id === 'appModal') {
                    document.getElementById('appModal').style.display = 'none';
                }
            },
            closeModalDirect() {
                document.getElementById('appModal').style.display = 'none';
            },
            handleSearch(q) {
                const match = GAS_MODULES.find(m => m.title.toLowerCase().includes(q.toLowerCase()));
                if (q.length > 2 && match) {
                    Router.navigate(match.id);
                }
            }
        };

        // Initialize on DOM Ready
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
