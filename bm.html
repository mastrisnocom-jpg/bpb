<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#00529C">
    <title>Portal Operasional Facility & Building Management</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & CSS VARIABLES
           ========================================================================== */
        :root {
            --primary: #00529C;
            --primary-dark: #003B73;
            --primary-light: #E6F0FA;
            --primary-glow: rgba(0, 82, 156, 0.25);
            
            --accent-green: #00AA13;
            --accent-yellow: #FDB813;
            --accent-red: #EE2737;
            --accent-purple: #8B5CF6;
            --accent-teal: #14B8A6;
            --accent-orange: #F97316;

            --bg-body: #F4F6F9;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-header: rgba(255, 255, 255, 0.9);
            --bg-sidebar: #FFFFFF;
            --bg-hover: #F1F5F9;
            --border-color: #E2E8F0;

            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-light: #94A3B8;

            --shadow-sm: 0 2px 6px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            --shadow-bottom-nav: 0 -4px 25px rgba(0, 0, 0, 0.08);

            --sidebar-width: 280px;
            --sidebar-width-collapsed: 80px;
            --header-height: 70px;
            --bottom-nav-height: 68px;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-pill: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #090D16;
            --bg-card: rgba(19, 27, 46, 0.95);
            --bg-header: rgba(15, 23, 42, 0.9);
            --bg-sidebar: #0F172A;
            --bg-hover: #1E293B;
            --border-color: #1E293B;

            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --text-light: #64748B;

            --primary-light: rgba(0, 82, 156, 0.25);
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.3);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.5);
            --shadow-lg: 0 20px 35px -10px rgba(0,0,0,0.7);
            --shadow-bottom-nav: 0 -4px 25px rgba(0,0,0,0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a { text-decoration: none; color: inherit; }
        button { border: none; outline: none; background: transparent; cursor: pointer; font-family: inherit; }

        /* ==========================================================================
           2. HEADER
           ========================================================================== */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: var(--bg-header);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            transition: var(--transition);
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.15rem;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-search { position: relative; margin-left: 1.5rem; display: none; }
        .header-search input {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 0.55rem 1rem 0.55rem 2.4rem;
            border-radius: var(--radius-pill);
            color: var(--text-main);
            font-size: 0.85rem;
            width: 260px;
            transition: var(--transition);
        }
        .header-search input:focus {
            width: 320px;
            background: var(--bg-card);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            outline: none;
        }
        .header-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        .header-center {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .live-clock {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .live-date {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .header-right { display: flex; align-items: center; gap: 0.5rem; }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            background: var(--bg-hover);
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .profile-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0.6rem 0.3rem 0.3rem;
            border-radius: var(--radius-pill);
            background: var(--bg-hover);
            cursor: pointer;
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
        }

        /* ==========================================================================
           3. APP LAYOUT
           ========================================================================== */
        .app-shell {
            display: flex;
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
        }

        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem 0.75rem;
            z-index: 900;
            transition: var(--transition);
            overflow-y: auto;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem;
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            margin-bottom: 1.25rem;
        }

        .sidebar-user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .sidebar-user-info h4 { font-size: 0.85rem; font-weight: 800; }
        .sidebar-user-info p { font-size: 0.72rem; color: var(--accent-green); font-weight: 700; }

        .sidebar-menu-title {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-light);
            padding: 0.5rem 0.75rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.7rem 0.85rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .nav-item.active a, .nav-item a:hover {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        .app-main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 1.5rem;
            padding-bottom: calc(var(--bottom-nav-height) + 2rem);
            min-height: calc(100vh - var(--header-height));
            transition: var(--transition);
        }

        /* ==========================================================================
           4. REDESIGNED PORTAL CARDS (100% OPERASIONAL BM)
           ========================================================================== */
        .portal-container {
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hero-banner {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem;
            color: #fff;
            box-shadow: 0 10px 25px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .hero-banner::after {
            content: '';
            position: absolute;
            right: -20px;
            bottom: -20px;
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .hero-status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .hero-banner h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 0.2rem; }
        .hero-banner p { font-size: 0.78rem; opacity: 0.9; }

        .section-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .card-header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.1rem;
        }

        .card-title-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .grid-icon-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem 0.5rem;
        }

        .menu-item-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .menu-item-btn:hover { transform: translateY(-3px); }

        .circle-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            margin-bottom: 0.5rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            font-size: 1.35rem;
            transition: var(--transition);
        }

        .circle-icon svg { width: 26px; height: 26px; }

        .menu-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .stat-box {
            background: var(--bg-hover);
            padding: 0.85rem 0.6rem;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-box h3 { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
        .stat-box p { font-size: 0.68rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }

        .action-item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1rem;
            background: var(--bg-hover);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .action-item-card:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateX(3px);
        }

        .action-left { display: flex; align-items: center; gap: 0.75rem; }
        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: var(--bg-card);
        }

        .action-text h4 { font-size: 0.82rem; font-weight: 800; }
        .action-text p { font-size: 0.7rem; color: var(--text-muted); }

        .btn-direct {
            background: var(--primary);
            color: #fff;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius-pill);
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 10px var(--primary-glow);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-direct:hover { background: var(--primary-dark); transform: translateY(-1px); }

        /* ==========================================================================
           5. BOTTOM NAVIGATION
           ========================================================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 0 0.5rem;
            z-index: 1000;
            box-shadow: var(--shadow-bottom-nav);
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            flex: 1;
            padding: 6px 0;
            transition: var(--transition);
        }

        .bottom-nav-item svg { width: 22px; height: 22px; }
        .bottom-nav-item.active { color: var(--primary); }

        .app-footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 1.25rem 1.5rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            min-width: 280px;
            background: var(--bg-card);
            color: var(--text-main);
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            animation: slideInRight 0.3s forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-card {
            background: var(--bg-card);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (min-width: 992px) {
            .header-search { display: block; }
            .header-center { display: flex; }
        }

        @media (max-width: 991px) {
            .app-sidebar { width: var(--sidebar-width-collapsed); }
            .sidebar-user, .sidebar-menu-title, .nav-item span { display: none; }
            .app-main-content { margin-left: var(--sidebar-width-collapsed); }
        }

        @media (max-width: 767px) {
            .app-sidebar { display: none; }
            .bottom-nav { display: flex; }
            .app-main-content { margin-left: 0; padding: 1rem; padding-bottom: calc(var(--bottom-nav-height) + 1.5rem); }
            .app-footer { margin-bottom: var(--bottom-nav-height); }
        }
    </style>
</head>
<body>

    <!-- TOP HEADER BAR -->
    <header class="app-header">
        <div class="header-left">
            <div class="brand" onclick="Router.navigate('beranda')">
                <div class="brand-badge">BM</div>
                <div class="brand-text">
                    <h1>Portal BM</h1>
                    <p>Facility System</p>
                </div>
            </div>

            <div class="header-search">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path></svg>
                <input type="text" placeholder="Cari modul operasional BM..." onkeyup="App.handleSearch(this.value)">
            </div>
        </div>

        <div class="header-center">
            <div class="live-clock" id="clock">00:00:00 WIB</div>
            <div class="live-date" id="date">Hari, 00 Bulan 2026</div>
        </div>

        <div class="header-right">
            <button class="icon-btn" onclick="App.toggleFullscreen()" title="Fullscreen" aria-label="Fullscreen">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"></path></svg>
            </button>
            <button class="icon-btn" id="themeToggleBtn" onclick="Theme.toggle()" title="Toggle Tema" aria-label="Theme Switch">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path></svg>
            </button>
            <div class="profile-btn" onclick="Router.navigate('profil')">
                <div class="profile-avatar">S</div>
            </div>
        </div>
    </header>

    <!-- APP SHELL -->
    <div class="app-shell">
        
        <!-- SIDEBAR DESKTOP -->
        <aside class="app-sidebar" id="sidebar">
            <div>
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">S</div>
                    <div class="sidebar-user-info">
                        <h4>Sutrisno</h4>
                        <p>Unit Leader BM</p>
                    </div>
                </div>

                <div class="sidebar-menu-title">Daftar Modul BM</div>
                <ul class="nav-list" id="sidebarNavList">
                    <!-- Dynamic Sidebar Modules -->
                </ul>
            </div>
            <div>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="javascript:void(0)" onclick="App.openDirectLink(BASE_GAS_URL + '?page=dashboard')">
                            <span style="font-size:1.1rem; width:20px; text-align:center;">📊</span>
                            <span>Dashboard GAS</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- DYNAMIC MAIN CONTENT -->
        <main class="app-main-content" id="appContent">
            <!-- Rendered by Router -->
        </main>
    </div>

    <!-- BOTTOM NAVIGATION (MOBILE) -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="#/beranda" class="bottom-nav-item active" data-route="beranda">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"></path></svg>
            <span>Beranda</span>
        </a>
        <a href="javascript:void(0)" onclick="App.openAllMenuModal()" class="bottom-nav-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"></path></svg>
            <span>Semua Modul</span>
        </a>
        <a href="#/profil" class="bottom-nav-item" data-route="profil">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path></svg>
            <span>Profil</span>
        </a>
    </nav>

    <!-- FOOTER -->
    <footer class="app-footer">
        <div>&copy; <span id="footerYear">2026</span> <strong>Portal Operasional BM</strong>. All Rights Reserved.</div>
        <div>Status: <strong style="color:var(--accent-green)">● Google Apps Script Server Active</strong></div>
    </footer>

    <!-- TOAST & MODAL CONTAINERS -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-backdrop" id="appModal" onclick="App.closeModal(event)">
        <div class="modal-card" id="modalCard"></div>
    </div>

    <!-- ==========================================================================
         MODULAR JAVASCRIPT ES6+
         ========================================================================== -->
    <script>
        const BASE_GAS_URL = "https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec";

        // Registrasi 14 Modul Operasional Murni
        const GAS_MODULES = [
            { id: 'dashboard', title: 'Dashboard Utama', desc: 'Panel statistik & ringkasan operasional', icon: '📊', color: '#3B82F6', url: `${BASE_GAS_URL}?page=dashboard` },
            { id: 'kerusakan', title: 'Lapor Kerusakan', desc: 'Form input pengaduan kerusakan fasilitas', icon: '🛠️', color: '#EE2737', url: `${BASE_GAS_URL}?page=kerusakan` },
            { id: 'jadwal-kerusakan', title: 'Jadwal Perbaikan', desc: 'Timeline & monitoring progress perbaikan', icon: '📅', color: '#F97316', url: `${BASE_GAS_URL}?page=jadwal-kerusakan` },
            { id: 'checklist-harian-pm', title: 'Checklist Harian', desc: 'Inspeksi & kontrol rutin sarana gedung', icon: '📋', color: '#10B981', url: `${BASE_GAS_URL}?page=checklist-harian-pm` },
            { id: 'dashboard-checklist-pm', title: 'Rekap Checklist', desc: 'Statistik kepatuhan checklist harian', icon: '📈', color: '#00AA13', url: `${BASE_GAS_URL}?page=dashboard-checklist-pm` },
            { id: 'perencanaan-pm', title: 'Rencana PM', desc: 'Jadwal Preventive Maintenance tahunan', icon: '⚙️', color: '#8B5CF6', url: `${BASE_GAS_URL}?page=perencanaan-pm` },
            { id: 'progres-jadwal-pm', title: 'Progress PM', desc: 'Realisasi jadwal perawatan berkala', icon: '⏳', color: '#6366F1', url: `${BASE_GAS_URL}?page=progres-jadwal-pm` },
            { id: 'dashboard-pm', title: 'Dashboard PM', desc: 'Evaluasi & performa pemeliharaan gedung', icon: '📉', color: '#EC4899', url: `${BASE_GAS_URL}?page=dashboard-pm` },
            { id: 'plts-dashboard', title: 'PLTS Solar', desc: 'Monitoring produksi daya panel surya', icon: '☀️', color: '#FDB813', url: `${BASE_GAS_URL}?page=plts-dashboard` },
            { id: 'energi-dashboard', title: 'Energi Listrik', desc: 'Monitoring konsumsi kWh PLN & Genset', icon: '⚡', color: '#EAB308', url: `${BASE_GAS_URL}?page=energi-dashboard` },
            { id: 'dashboard-atm', title: 'Monitoring ATM', desc: 'Kebersihan, AC & fisik galeri ATM', icon: '🏧', color: '#14B8A6', url: `${BASE_GAS_URL}?page=dashboard-atm` },
            { id: 'bast', title: 'Input BAST', desc: 'Form Berita Acara Serah Terima pekerjaan', icon: '📝', color: '#0284C7', url: `${BASE_GAS_URL}?page=bast` },
            { id: 'dashboard-bast', title: 'Dashboard BAST', desc: 'Rekap & arsip dokumen BAST teknisi', icon: '📑', color: '#475569', url: `${BASE_GAS_URL}?page=dashboard-bast` },
            { id: 'index', title: 'Portal Index', desc: 'Indeks navigasi lengkap sistem GAS', icon: '📁', color: '#64748B', url: `${BASE_GAS_URL}?page=index` }
        ];

        // 8 Modul Prioritas untuk Tampilan Grid Depan
        const PRIMARY_GRID_IDS = [
            'kerusakan',
            'jadwal-kerusakan',
            'checklist-harian-pm',
            'dashboard-atm',
            'plts-dashboard',
            'energi-dashboard',
            'perencanaan-pm'
        ];

        const Theme = {
            init() {
                const saved = localStorage.getItem('app_theme') || 'light';
                document.documentElement.setAttribute('data-theme', saved);
                this.updateBtn(saved);
            },
            toggle() {
                const current = document.documentElement.getAttribute('data-theme');
                const target = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', target);
                localStorage.setItem('app_theme', target);
                this.updateBtn(target);
                App.showToast(`Beralih ke mode ${target === 'dark' ? 'Gelap' : 'Terang'}`);
            },
            updateBtn(theme) {
                const btn = document.getElementById('themeToggleBtn');
                if (btn) {
                    btn.innerHTML = theme === 'dark'
                        ? '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path></svg>'
                        : '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path></svg>';
                }
            }
        };

        const Clock = {
            init() {
                this.tick();
                setInterval(() => this.tick(), 1000);
            },
            tick() {
                const now = new Date();
                const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

                const day = days[now.getDay()];
                const d = now.getDate();
                const m = months[now.getMonth()];
                const y = now.getFullYear();

                const h = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');

                const clockEl = document.getElementById('clock');
                const dateEl = document.getElementById('date');

                if (clockEl) clockEl.innerText = `${h}:${min}:${s} WIB`;
                if (dateEl) dateEl.innerText = `${day}, ${d} ${m} ${y}`;
            }
        };

        const Router = {
            init() {
                window.addEventListener('hashchange', () => this.render());
                this.render();
            },
            navigate(route) {
                window.location.hash = '#/' + route;
            },
            render() {
                const route = window.location.hash.replace('#/', '') || 'beranda';
                this.updateNavActive(route);

                const content = document.getElementById('appContent');
                const gasMatch = GAS_MODULES.find(m => m.id === route);

                if (route === 'beranda') {
                    content.innerHTML = this.viewHome();
                } else if (route === 'profil') {
                    content.innerHTML = this.viewProfile();
                } else if (gasMatch) {
                    content.innerHTML = this.viewModuleDetail(gasMatch);
                } else {
                    content.innerHTML = `
                        <div class="portal-container" style="text-align:center; padding:3rem 1rem;">
                            <h2>Halaman Tidak Ditemukan</h2>
                            <p style="color:var(--text-muted); margin: 0.5rem 0 1.5rem;">Rute modul tidak tersedia.</p>
                            <button class="btn-direct" onclick="Router.navigate('beranda')">Kembali ke Beranda</button>
                        </div>
                    `;
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            updateNavActive(route) {
                document.querySelectorAll('#sidebarNavList .nav-item').forEach(li => {
                    li.classList.toggle('active', li.getAttribute('data-route') === route);
                });
                document.querySelectorAll('.bottom-nav-item').forEach(a => {
                    a.classList.toggle('active', a.getAttribute('data-route') === route);
                });
            },
            viewHome() {
                const primaryModules = PRIMARY_GRID_IDS.map(id => GAS_MODULES.find(m => m.id === id)).filter(Boolean);

                return `
                    <div class="portal-container">
                        
                        <!-- HERO BANNER OPERASIONAL -->
                        <div class="hero-banner">
                            <div class="hero-status-tag">
                                <span>●</span> Unit KC Surabaya & Jatim
                            </div>
                            <h2>Building Management Hub</h2>
                            <p>Sistem terpusat pemantauan sarana, checklist harian, energi & BAST teknisi.</p>
                        </div>

                        <!-- STATISTIK RINGKAS SISTEM -->
                        <div class="stat-grid">
                            <div class="stat-box">
                                <h3>14</h3>
                                <p>Modul Aktif</p>
                            </div>
                            <div class="stat-box">
                                <h3>9</h3>
                                <p>Titik Kantor</p>
                            </div>
                            <div class="stat-box">
                                <h3 style="color:var(--accent-green);">100%</h3>
                                <p>Kesiapan Unit</p>
                            </div>
                        </div>

                        <!-- 8 MENU UTAMA OPERASIONAL -->
                        <div class="section-card">
                            <div class="card-header-flex">
                                <div class="card-title-wrap">
                                    <span>⚡</span>
                                    <span>Menu Operasional Utama</span>
                                </div>
                            </div>

                            <div class="grid-icon-layout">
                                ${primaryModules.map(m => `
                                    <div class="menu-item-btn" onclick="App.openDirectLink('${m.url}')">
                                        <div class="circle-icon" style="background: ${m.color};">
                                            ${m.icon}
                                        </div>
                                        <span class="menu-label">${m.title}</span>
                                    </div>
                                `).join('')}

                                <!-- Tombol Semua Menu -->
                                <div class="menu-item-btn" onclick="App.openAllMenuModal()">
                                    <div class="circle-icon" style="background: #2563EB;">
                                        📁
                                    </div>
                                    <span class="menu-label">Semua Modul</span>
                                </div>
                            </div>
                        </div>

                        <!-- QUICK ACTIONS & LAPORAN CEPAT -->
                        <div class="section-card">
                            <div class="card-header-flex">
                                <div class="card-title-wrap">
                                    <span>🚀</span>
                                    <span>Aksi Cepat Teknisi</span>
                                </div>
                            </div>

                            <div class="action-list">
                                <div class="action-item-card" onclick="App.openDirectLink('${BASE_GAS_URL}?page=kerusakan')">
                                    <div class="action-left">
                                        <div class="action-icon">🛠️</div>
                                        <div class="action-text">
                                            <h4>Input Laporan Kerusakan Baru</h4>
                                            <p>Kirim tiket kendala sarana gedung</p>
                                        </div>
                                    </div>
                                    <span style="font-weight:800; color:var(--primary);">↗</span>
                                </div>

                                <div class="action-item-card" onclick="App.openDirectLink('${BASE_GAS_URL}?page=checklist-harian-pm')">
                                    <div class="action-left">
                                        <div class="action-icon">📋</div>
                                        <div class="action-text">
                                            <h4>Pengisian Checklist Harian</h4>
                                            <p>Inspeksi harian teknisi gedung</p>
                                        </div>
                                    </div>
                                    <span style="font-weight:800; color:var(--primary);">↗</span>
                                </div>

                                <div class="action-item-card" onclick="App.openDirectLink('${BASE_GAS_URL}?page=bast')">
                                    <div class="action-left">
                                        <div class="action-icon">📝</div>
                                        <div class="action-text">
                                            <h4>Form Input BAST Pekerjaan</h4>
                                            <p>Berita acara serah terima selesai kerja</p>
                                        </div>
                                    </div>
                                    <span style="font-weight:800; color:var(--primary);">↗</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            },
            viewModuleDetail(menu) {
                return `
                    <div class="portal-container">
                        <div class="section-card" style="text-align:center; padding: 2rem 1.5rem;">
                            <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">${menu.icon}</div>
                            <h2 style="font-size:1.35rem; font-weight:800; margin-bottom:0.35rem;">${menu.title}</h2>
                            <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.5; margin-bottom:1.5rem;">
                                ${menu.desc}
                            </p>

                            <div style="background:var(--bg-hover); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color); margin-bottom:1.5rem; text-align:left; font-size:0.8rem; display:flex; flex-direction:column; gap:0.4rem;">
                                <div><strong>Integrasi:</strong> Google Apps Script Web App</div>
                                <div><strong>Target:</strong> Full Window Direct Access (Bypass iFrame Lock)</div>
                                <div><strong>Status Sistem:</strong> <span style="color:var(--accent-green); font-weight:700;">Siap Digunakan</span></div>
                            </div>

                            <div style="display:flex; flex-direction:column; gap:0.75rem;">
                                <button class="btn-direct" onclick="App.openDirectLink('${menu.url}')">
                                    Buka Modul Sekarang ↗
                                </button>
                                <button class="btn-direct" style="background:var(--bg-hover); color:var(--text-main); border:1px solid var(--border-color); box-shadow:none;" onclick="Router.navigate('beranda')">
                                    Kembali ke Beranda
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },
            viewProfile() {
                return `
                    <div class="portal-container">
                        <div class="section-card" style="text-align:center;">
                            <div class="sidebar-user-avatar" style="width:70px; height:70px; margin:0 auto 1rem; font-size:1.6rem;">S</div>
                            <h3 style="font-weight:800;">SUTRISNO</h3>
                            <p style="font-size:0.8rem; color:var(--accent-green); font-weight:700; margin-bottom:1.5rem;">Unit Leader Building Management</p>
                            
                            <div style="text-align:left; font-size:0.85rem; display:flex; flex-direction:column; gap:0.75rem; background:var(--bg-hover); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color); margin-bottom:1.25rem;">
                                <div><strong>ID Teknisi:</strong> BM-2026-901</div>
                                <div><strong>Wilayah Kerja:</strong> KC Surabaya & 9 Kantor Cabang</div>
                                <div><strong>Sistem:</strong> Google Apps Script Engine</div>
                            </div>

                            <button class="btn-direct" onclick="Router.navigate('beranda')">Kembali ke Beranda</button>
                        </div>
                    </div>
                `;
            }
        };

        const App = {
            init() {
                Theme.init();
                Clock.init();
                this.renderSidebar();
                Router.init();
                document.getElementById('footerYear').innerText = new Date().getFullYear();
            },
            renderSidebar() {
                const list = document.getElementById('sidebarNavList');
                let html = `
                    <li class="nav-item active" data-route="beranda">
                        <a href="#/beranda">
                            <span style="font-size:1.1rem; width:20px; text-align:center;">🏠</span>
                            <span>Beranda</span>
                        </a>
                    </li>
                `;

                GAS_MODULES.forEach(m => {
                    html += `
                        <li class="nav-item" data-route="${m.id}">
                            <a href="javascript:void(0)" onclick="App.openDirectLink('${m.url}')">
                                <span style="font-size:1.1rem; width:20px; text-align:center;">${m.icon}</span>
                                <span>${m.title}</span>
                            </a>
                        </li>
                    `;
                });

                list.innerHTML = html;
            },
            openDirectLink(url) {
                this.showToast('Membuka modul Google Apps Script...', 'info');
                window.open(url, '_blank', 'noopener,noreferrer');
            },
            showToast(msg, type = 'info') {
                const con = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `<span>⚡</span><span>${msg}</span>`;
                con.appendChild(t);
                setTimeout(() => {
                    t.style.opacity = '0';
                    t.style.transform = 'translateX(100%)';
                    t.style.transition = 'all 0.3s ease';
                    setTimeout(() => t.remove(), 300);
                }, 2500);
            },
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            },
            openAllMenuModal() {
                const card = document.getElementById('modalCard');
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
                        <h3 style="font-size:1.1rem; font-weight:800;">14 Modul Operasional BM</h3>
                        <button onclick="App.closeModalDirect()" style="font-size:1.2rem; font-weight:700;">✕</button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; max-height:60vh; overflow-y:auto;">
                        ${GAS_MODULES.map(m => `
                            <button onclick="App.closeModalDirect(); App.openDirectLink('${m.url}')" style="text-align:left; padding:0.75rem; background:var(--bg-hover); border-radius:12px; font-size:0.78rem; font-weight:700; border:1px solid var(--border-color); display:flex; align-items:center; gap:6px;">
                                <span>${m.icon}</span>
                                <span>${m.title}</span>
                            </button>
                        `).join('')}
                    </div>
                `;
                document.getElementById('appModal').style.display = 'flex';
            },
            closeModal(e) {
                if (e.target.id === 'appModal') {
                    document.getElementById('appModal').style.display = 'none';
                }
            },
            closeModalDirect() {
                document.getElementById('appModal').style.display = 'none';
            },
            handleSearch(q) {
                const match = GAS_MODULES.find(m => m.title.toLowerCase().includes(q.toLowerCase()));
                if (q.length > 2 && match) {
                    this.openDirectLink(match.url);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
