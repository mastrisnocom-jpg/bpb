<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal BM - Akses Cepat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --primary-glow: rgba(5, 150, 105, 0.35);
            --bg-gradient: radial-gradient(circle at 50% 0%, #ecfdf5 0%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.7);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --badge-bg: #d1fae5;
            --badge-text: #065f46;
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(226, 232, 240, 0.8);
        }

        [data-theme="dark"] {
            --primary: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-gradient: radial-gradient(circle at 50% 0%, #064e3b 0%, #090d16 100%);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --badge-bg: rgba(16, 185, 129, 0.15);
            --badge-text: #34d399;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s ease, border-color 0.3s ease;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand img {
            height: 32px;
            width: auto;
        }

        .live-clock-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            background: var(--card-bg);
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-card);
            position: relative;
            transform: translateY(0);
            animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 0.4rem 0.9rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0.6;
            animation: ripple 1.6s infinite ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        .card-logo {
            width: 64px;
            height: 64px;
            background: #ffffff;
            border-radius: 20px;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card-logo img {
            width: 42px;
            height: auto;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .cta-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1.15rem 1.5rem;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 18px;
            box-shadow: 0 12px 24px var(--primary-glow);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        .cta-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 16px 30px var(--primary-glow);
        }

        .cta-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .cta-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }

        .cta-btn:hover svg {
            transform: translateX(4px);
        }

        .cta-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-25deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0%, 60% { left: -100%; }
            100% { left: 160%; }
        }

        .security-badge {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .security-badge svg {
            width: 14px;
            height: 14px;
            color: var(--primary);
        }

        footer {
            padding: 1.25rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="https://www.belfis.bpb.co.id/assets/img/logo-8-t.png" alt="Belfis">
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="live-clock-badge" id="liveClock">Loading...</div>
            <button class="theme-btn" id="themeToggle" title="Ganti Tema" aria-label="Toggle Dark Mode">🌙</button>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="badge-status">
                <span class="pulse-dot"></span>
                Sistem Terhubung
            </div>

            <div class="card-logo">
                <img src="https://www.belfis.bpb.co.id/assets/img/logo-8-t.png" alt="Portal Logo">
            </div>

            <h1 class="title">Portal Building Management</h1>
            <p class="subtitle">Akses langsung seluruh checklist, monitoring operasional & pelaporan fasilitas.</p>

            <a href="https://script.google.com/macros/s/AKfycbwBnM-oi29uwN1lQjBk7ad-nNIhRSAngNty2TVxnjyDwZkO3UC5315skPv06vnvXh8zbw/exec" 
               class="cta-btn" 
               id="portalLink">
                <span>Buka Dashboard BM</span>
                <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                </svg>
                <div class="cta-shine"></div>
            </a>

            <div class="security-badge">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9 9 4 9 9z"></path>
                </svg>
                <span>Akses Resmi Google Cloud Workspace</span>
            </div>
        </div>
    </main>

    <footer>
        &copy; <span id="year"></span> Building Management System. All Rights Reserved.
    </footer>

    <script>
        // Update Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Real-Time Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveClock').textContent = timeStr + ' WIB';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Theme Toggle (Light / Dark)
        const themeBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('bm_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('bm_theme', theme);
        }
        applyTheme(savedTheme);

        themeBtn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Click Ripple & Immediate Launch Feedback
        const portalBtn = document.getElementById('portalLink');
        portalBtn.addEventListener('click', function() {
            this.style.opacity = '0.85';
            this.querySelector('span').textContent = 'Membuka Sistem...';
        });
    </script>
</body>
</html>
