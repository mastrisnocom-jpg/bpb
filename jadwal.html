<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Harian Teknisi & Cleaning</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl font-bold text-slate-900">Jadwal Kerja Harian</h1>
      <p class="text-sm text-slate-500">Kelola jadwal tugas Teknisi dan Cleaning Service dengan mudah.</p>
    </header>

    <!-- Form Tambah Jadwal -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Tambah Jadwal Baru</h2>
      <form id="scheduleForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Nama Petugas</label>
          <input type="text" id="name" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Peran / Divisi</label>
          <select id="role" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Teknisi">Teknisi</option>
            <option value="Cleaning">Cleaning Service</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Deskripsi Tugas / Area</label>
          <input type="text" id="task" required placeholder="Contoh: Perbaikan AC Lantai 2" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Mulai</label>
          <input type="time" id="startTime" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jam Berakhir</label>
          <input type="time" id="endTime" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-end">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
            + Tambah Jadwal
          </button>
        </div>

      </form>
    </section>

    <!-- Tabel Jadwal -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-900">Daftar Jadwal Harian</h2>
        <span id="totalTask" class="text-xs bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full">0 Tugas</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-100/50 text-slate-600 text-xs uppercase font-semibold">
              <th class="p-3">Waktu</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Peran</th>
              <th class="p-3">Tugas / Area</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="scheduleTable" class="divide-y divide-slate-100 text-sm">
            <!-- Data akan ditambahkan di sini secara dinamis -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- JavaScript Sederhana untuk Interaktivitas -->
  <script>
    const form = document.getElementById('scheduleForm');
    const tableBody = document.getElementById('scheduleTable');
    const totalTaskLabel = document.getElementById('totalTask');
    let count = 0;

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const role = document.getElementById('role').value;
      const task = document.getElementById('task').value;
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;

      // Badge Warna berdasarkan Peran
      const roleBadge = role === 'Teknisi' 
        ? `<span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2 py-0.5 rounded">Teknisi</span>`
        : `<span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-2 py-0.5 rounded">Cleaning</span>`;

      const row = document.createElement('tr');
      row.className = 'hover:bg-slate-50 transition';
      row.innerHTML = `
        <td class="p-3 whitespace-nowrap font-medium text-slate-700">${startTime} - ${endTime}</td>
        <td class="p-3 font-semibold text-slate-900">${name}</td>
        <td class="p-3">${roleBadge}</td>
        <td class="p-3 text-slate-600">${task}</td>
        <td class="p-3">
          <select onchange="updateStatus(this)" class="text-xs bg-slate-100 border border-slate-300 rounded px-2 py-1 focus:outline-none">
            <option value="Belum">Belum</option>
            <option value="Proses">Proses</option>
            <option value="Selesai">Selesai</option>
          </select>
        </td>
        <td class="p-3 text-center">
          <button onclick="deleteRow(this)" class="text-red-500 hover:text-red-700 text-xs font-medium">Hapus</button>
        </td>
      `;

      tableBody.appendChild(row);
      count++;
      totalTaskLabel.innerText = `${count} Tugas`;
      form.reset();
    });

    function deleteRow(button) {
      button.closest('tr').remove();
      count--;
      totalTaskLabel.innerText = `${count} Tugas`;
    }

    function updateStatus(select) {
      select.className = 'text-xs border rounded px-2 py-1 focus:outline-none ';
      if (select.value === 'Selesai') {
        select.classList.add('bg-green-100', 'text-green-700', 'border-green-300');
      } else if (select.value === 'Proses') {
        select.classList.add('bg-yellow-100', 'text-yellow-700', 'border-yellow-300');
      } else {
        select.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300');
      }
    }
  </script>
</body>
</html>
