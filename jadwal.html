<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Jadwal Operasional</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 relative selection:bg-indigo-500 selection:text-white">

  <!-- Background Decorative Blur Glows -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-6xl mx-auto space-y-6 relative z-10">
    
    <!-- Header Dashboard -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-800/60 backdrop-blur-xl p-6 rounded-2xl border border-slate-700/50 shadow-2xl">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <p class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Sistem Manajemen Harian</p>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">Jadwal Teknisi & Cleaning</h1>
      </div>
      
      <!-- Button Trigger Pop-up Form -->
      <button onclick="toggleModal(true)" class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-semibold px-5 py-3 rounded-xl shadow-lg shadow-indigo-500/25 transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>Tambah Jadwal</span>
      </button>
    </header>

    <!-- Stat Ringkasan -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl flex items-center gap-4">
        <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <div>
          <p class="text-xs text-slate-400">Total Tugas Hari Ini</p>
          <p id="totalTaskCount" class="text-xl font-bold text-white">0</p>
        </div>
      </div>
      
      <div class="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl flex items-center gap-4">
        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <p class="text-xs text-slate-400">Dalam Proses</p>
          <p id="inProgressCount" class="text-xl font-bold text-amber-400">0</p>
        </div>
      </div>

      <div class="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl flex items-center gap-4">
        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
          <p class="text-xs text-slate-400">Selesai</p>
          <p id="completedCount" class="text-xl font-bold text-emerald-400">0</p>
        </div>
      </div>
    </div>

    <!-- Tabel Jadwal -->
    <section class="bg-slate-800/60 backdrop-blur-xl rounded-2xl border border-slate-700/50 shadow-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-700/80 bg-slate-800/80 text-slate-400 text-xs uppercase tracking-wider font-semibold">
              <th class="p-4">Waktu</th>
              <th class="p-4">Petugas</th>
              <th class="p-4">Peran</th>
              <th class="p-4">Detail Tugas / Area</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="scheduleTable" class="divide-y divide-slate-700/50 text-sm">
            <!-- Empty State jika belum ada data -->
            <tr id="emptyState">
              <td colspan="6" class="p-8 text-center text-slate-500">
                <svg class="w-12 h-12 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Belum ada jadwal yang ditambahkan hari ini.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- POP-UP MODAL FORM -->
  <div id="scheduleModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 p-4">
    
    <div id="modalCard" class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300">
      
      <!-- Header Modal -->
      <div class="flex justify-between items-center px-6 py-4 border-b border-slate-800 bg-slate-800/40">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          Tambah Jadwal Kerja
        </h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Form Modal -->
      <form id="scheduleForm" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Petugas</label>
          <input type="text" id="name" required placeholder="Contoh: Budi Santoso" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Peran / Divisi</label>
          <select id="role" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="Teknisi">Teknisi</option>
            <option value="Cleaning">Cleaning Service</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Detail Tugas / Lokasi</label>
          <input type="text" id="task" required placeholder="Contoh: Maintenance AC & Filter Lantai 3" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Jam Mulai</label>
            <input type="time" id="startTime" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Jam Berakhir</label>
            <input type="time" id="endTime" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
          </div>
        </div>

        <!-- Footer Modal Buttons -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition">
            Batal
          </button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition">
            Simpan Jadwal
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- JavaScript Logika -->
  <script>
    const modal = document.getElementById('scheduleModal');
    const modalCard = document.getElementById('modalCard');
    const form = document.getElementById('scheduleForm');
    const tableBody = document.getElementById('scheduleTable');
    const emptyState = document.getElementById('emptyState');

    let tasks = [];

    // Fungsi Toggle Modal Pop-up
    function toggleModal(show) {
      if (show) {
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
          modalCard.classList.remove('scale-95');
          modalCard.classList.add('scale-100');
        }, 10);
      } else {
        modal.classList.add('opacity-0');
        modalCard.classList.remove('scale-100');
        modalCard.classList.add('scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
          form.reset();
        }, 300);
      }
    }

    // Submit Form
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const newTask = {
        id: Date.now(),
        name: document.getElementById('name').value,
        role: document.getElementById('role').value,
        task: document.getElementById('task').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        status: 'Belum'
      };

      tasks.push(newTask);
      renderTasks();
      toggleModal(false);
    });

    // Render Data Tabel & Counter Status
    function renderTasks() {
      // Hapus baris tabel yang ada (kecuali jika kosong)
      tableBody.innerHTML = '';

      if (tasks.length === 0) {
        tableBody.appendChild(emptyState);
        updateCounters();
        return;
      }

      tasks.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/40 transition-colors group';

        // Styling Badge Peran
        const roleBadge = item.role === 'Teknisi' 
          ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>Teknisi
             </span>`
          : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Cleaning
             </span>`;

        row.innerHTML = `
          <td class="p-4 font-mono text-slate-300 font-medium whitespace-nowrap">
            ${item.startTime} - ${item.endTime}
          </td>
          <td class="p-4 font-semibold text-white">${item.name}</td>
          <td class="p-4">${roleBadge}</td>
          <td class="p-4 text-slate-300">${item.task}</td>
          <td class="p-4">
            <select onchange="updateStatus(${item.id}, this.value)" class="bg-slate-900 border border-slate-700 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
              <option value="Belum" ${item.status === 'Belum' ? 'selected' : ''}>⏱️ Belum</option>
              <option value="Proses" ${item.status === 'Proses' ? 'selected' : ''}>⚡ Proses</option>
              <option value="Selesai" ${item.status === 'Selesai' ? 'selected' : ''}>✅ Selesai</option>
            </select>
          </td>
          <td class="p-4 text-center">
            <button onclick="deleteTask(${item.id})" class="text-slate-500 hover:text-rose-400 p-1 rounded-lg transition" title="Hapus Jadwal">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </td>
        `;

        tableBody.appendChild(row);
      });

      updateCounters();
    }

    // Update Status
    function updateStatus(id, newStatus) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = newStatus;
        updateCounters();
      }
    }

    // Hapus Task
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    // Update Counter Dashboard Ringkasan
    function updateCounters() {
      document.getElementById('totalTaskCount').innerText = tasks.length;
      document.getElementById('inProgressCount').innerText = tasks.filter(t => t.status === 'Proses').length;
      document.getElementById('completedCount').innerText = tasks.filter(t => t.status === 'Selesai').length;
    }
  </script>
</body>
</html>
