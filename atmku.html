<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulasi Web ATM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .atm-container {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .balance-card {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }

    .balance-title {
      font-size: 0.85rem;
      color: #bfdbfe;
    }

    .balance-amount {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-action {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-action:hover {
      background: #475569;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .input-section {
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #38bdf8;
    }

    .btn-submit {
      width: 100%;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #0ea5e9;
    }

    .history-section {
      margin-top: 10px;
    }

    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .history-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }

    .history-item.plus {
      color: #4ade80;
    }

    .history-item.minus {
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="atm-container">
    <div class="header">
      <h1>BANK DIGITAL ATM</h1>
    </div>

    <!-- Saldo -->
    <div class="balance-card">
      <div class="balance-title">Saldo Rekening</div>
      <div class="balance-amount" id="balanceDisplay">Rp 1.000.000</div>
    </div>

    <!-- Pilihan Cepat -->
    <div class="grid-menu">
      <button class="btn-action" onclick="quickWithdraw(100000)">Tarik 100rb</button>
      <button class="btn-action" onclick="quickWithdraw(500000)">Tarik 500rb</button>
    </div>

    <!-- Form Transaksi -->
    <div class="input-section">
      <div class="input-group">
        <label for="amountInput">Nominal Transaksi (Rp)</label>
        <input type="number" id="amountInput" placeholder="Masukkan jumlah..." min="10000" step="10000" />
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn-submit" onclick="handleDeposit()">Setor Tunai</button>
        <button class="btn-submit" style="background: #f87171; color: #fff;" onclick="handleWithdraw()">Tarik Tunai</button>
      </div>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="history-section">
      <div class="history-title">Riwayat Transaksi Terakhir</div>
      <ul class="history-list" id="historyList">
        <li class="history-item">
          <span>Saldo Awal</span>
          <span>Rp 1.000.000</span>
        </li>
      </ul>
    </div>
  </div>

  <script>
    let currentBalance = 1000000;

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(number);
    }

    function updateBalanceUI() {
      document.getElementById('balanceDisplay').innerText = formatRupiah(currentBalance);
    }

    function addHistory(type, amount) {
      const list = document.getElementById('historyList');
      const item = document.createElement('li');
      item.className = `history-item ${type === 'Setor' ? 'plus' : 'minus'}`;
      item.innerHTML = `
        <span>${type}</span>
        <span>${type === 'Setor' ? '+' : '-'} ${formatRupiah(amount)}</span>
      `;
      list.prepend(item);
    }

    function handleDeposit() {
      const input = document.getElementById('amountInput');
      const amount = parseInt(input.value);

      if (isNaN(amount) || amount <= 0) {
        alert('Masukkan nominal setoran yang valid.');
        return;
      }

      currentBalance += amount;
      updateBalanceUI();
      addHistory('Setor', amount);
      input.value = '';
    }

    function handleWithdraw() {
      const input = document.getElementById('amountInput');
      const amount = parseInt(input.value);

      if (isNaN(amount) || amount <= 0) {
        alert('Masukkan nominal penarikan yang valid.');
        return;
      }

      if (amount > currentBalance) {
        alert('Saldo tidak mencukupi!');
        return;
      }

      currentBalance -= amount;
      updateBalanceUI();
      addHistory('Tarik', amount);
      input.value = '';
    }

    function quickWithdraw(amount) {
      if (amount > currentBalance) {
        alert('Saldo tidak mencukupi!');
        return;
      }
      currentBalance -= amount;
      updateBalanceUI();
      addHistory('Tarik', amount);
    }
  </script>
</body>
</html>
