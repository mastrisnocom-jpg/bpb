<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Content Scheduler Mobile Mini</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-size: 11px; }
    .font-signature { font-family: 'Brush Script MT', cursive, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen p-3 max-w-md mx-auto">

  <!-- Header Ringkas -->
  <header class="bg-slate-900/90 border border-slate-800 p-3 rounded-xl mb-3 shadow-lg">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <h1 class="text-sm font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent">
          Jadwal Ngonten
        </h1>
        <div class="border border-slate-700 bg-slate-800/80 px-1.5 py-0.2 rounded flex items-center gap-1">
          <span class="text-[8px] text-slate-400">TTD</span>
          <span class="text-[10px] text-indigo-300 font-signature italic font-bold">bpb</span>
        </div>
      </div>

      <!-- Navigasi Tanggal dengan Tombol Icon Prev & Next -->
      <div class="flex items-center gap-1 bg-slate-800/90 border border-slate-700 p-0.5 rounded-lg shadow-inner">
        <button 
          onclick="changeDate(-1)" 
          title="Hari Sebelumnya"
          class="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition active:scale-95">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
        </button>

        <input 
          type="date" 
          id="datePicker" 
          class="bg-transparent border-0 px-1 py-0.5 text-[10px] text-slate-200 focus:outline-none cursor-pointer"
        />

        <button 
          onclick="changeDate(1)" 
          title="Hari Berikutnya"
          class="p-1 text-slate-400 hover:text-white hover:bg-slate-700 rounded transition active:scale-95">
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Mini Progress -->
    <div class="mt-2.5 pt-2 border-t border-slate-800/80">
      <div class="flex justify-between items-center text-[10px] mb-1">
        <span class="text-slate-400">Progress Konten Hari Ini</span>
        <span id="progressText" class="text-indigo-400 font-bold">0/0 (0%)</span>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-blue-500 via-indigo-500 to-emerald-400 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- Matriks Kalender 30 Hari -->
  <section class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl mb-3 shadow-lg">
    <div class="flex justify-between items-center mb-1.5">
      <div class="flex items-center gap-1.5">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-400"></i>
        <span class="text-[11px] font-bold text-slate-200">Riwayat 30 Hari Terakhir</span>
      </div>
      <span id="monthlyStatsText" class="text-[9px] bg-slate-800 px-1.5 py-0.5 rounded text-indigo-300 border border-slate-700">0% Selesai</span>
    </div>

    <div id="calendar30Grid" class="grid grid-cols-10 gap-1 pt-1 pb-1"></div>

    <div class="mt-2 pt-1.5 border-t border-slate-800/80 flex justify-between items-center text-[8.5px] text-slate-400">
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-emerald-500 inline-block"></span> 100% OK</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-indigo-500 inline-block"></span> Sebagian</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-amber-400 inline-block"></span> Telat</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-rose-600/80 inline-block"></span> Kosong</span>
    </div>
  </section>

  <!-- Header List Jadwal -->
  <div class="flex justify-between items-center mb-2 px-0.5">
    <div class="flex items-center gap-1.5">
      <i data-lucide="list-todo" class="w-3.5 h-3.5 text-indigo-400"></i>
      <span class="text-xs font-bold text-slate-200">Daftar Slot Harian</span>
    </div>
    <button 
      onclick="openAddModal()" 
      class="flex items-center gap-1 text-[10px] bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-2.5 py-1 rounded-lg transition shadow">
      <i data-lucide="plus" class="w-3 h-3"></i> Tambah Slot
    </button>
  </div>

  <!-- Container List Jadwal -->
  <div id="scheduleContainer" class="space-y-2 mb-6"></div>

  <!-- Modal Tambah Slot -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/80 backdrop-blur-xs hidden items-center justify-center p-3 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-xs p-4 shadow-2xl">
      <h3 class="text-xs font-bold text-white mb-3 flex items-center gap-1.5">
        <i data-lucide="calendar-plus" class="w-3.5 h-3.5 text-indigo-400"></i> Tambah Jadwal Baru
      </h3>
      
      <div class="space-y-2.5">
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">Jam Tayang</label>
          <input type="time" id="newTime" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">Platform</label>
          <select id="newPlatform" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            <option value="ALL">FB Reels & YT Shorts</option>
            <option value="FB">FB Reels Saja</option>
            <option value="YT">YT Shorts Saja</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">Nama Fanpage / Akun Channel</label>
          <input type="text" id="newChannel" placeholder="@FanpageFB / @ChannelYT" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">Judul / Ide Konten</label>
          <input type="text" id="newTitle" placeholder="Contoh: Tutorial Ringkas Part 1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" />
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-2 border-t border-slate-800">
        <button onclick="closeAddModal()" class="px-3 py-1 rounded-md text-[10px] text-slate-400 hover:bg-slate-800">Batal</button>
        <button onclick="addNewSchedule()" class="px-3 py-1 rounded-md text-[10px] bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_TEMPLATES = [
      { time: '07:00', platform: 'ALL', channel: 'Akun Utama', title: 'Konten Pagi' },
      { time: '17:00', platform: 'ALL', channel: 'Akun Utama', title: 'Konten Sore' },
      { time: '23:00', platform: 'ALL', channel: 'Akun Utama', title: 'Konten Malam' }
    ];

    let currentDate = new Date().toISOString().split('T')[0];
    const datePicker = document.getElementById('datePicker');
    datePicker.value = currentDate;

    function getStoredData() {
      const data = localStorage.getItem('content_schedules_mini');
      return data ? JSON.parse(data) : {};
    }

    function saveData(data) {
      localStorage.setItem('content_schedules_mini', JSON.stringify(data));
    }

    function getSchedulesForDate(dateStr) {
      const allData = getStoredData();
      if (!allData[dateStr]) {
        allData[dateStr] = DEFAULT_TEMPLATES.map((tpl, idx) => ({
          id: 'item_' + Date.now() + '_' + idx,
          time: tpl.time,
          platform: tpl.platform,
          channel: tpl.channel,
          title: tpl.title,
          isApproved: false,
          approvedAt: null,
          isLate: false
        }));
        saveData(allData);
      }
      return allData[dateStr];
    }

    // Fungsi Navigasi Hari (Prev / Next)
    function changeDate(offsetDays) {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + offsetDays);
      currentDate = d.toISOString().split('T')[0];
      datePicker.value = currentDate;
      render();
    }

    function getRemainingTimeText(targetTimeStr, targetDateStr) {
      const now = new Date();
      const [hours, minutes] = targetTimeStr.split(':').map(Number);
      const target = new Date(targetDateStr);
      target.setHours(hours, minutes, 0, 0);

      const diff = target - now;
      if (diff <= 0) return { isPassed: true, text: 'Lewat' };

      const diffHrs = Math.floor(diff / (1000 * 60 * 60));
      const diffMins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const diffSecs = Math.floor((diff % (1000 * 60)) / 1000);

      return {
        isPassed: false,
        text: `${diffHrs.toString().padStart(2, '0')}:${diffMins.toString().padStart(2, '0')}:${diffSecs.toString().padStart(2, '0')}`
      };
    }

    function render30DayGrid() {
      const allData = getStoredData();
      const grid = document.getElementById('calendar30Grid');
      grid.innerHTML = '';

      const targetRefDate = new Date(currentDate);
      let totalSlotsCount = 0;
      let totalApprovedCount = 0;

      for (let i = 29; i >= 0; i--) {
        const d = new Date(targetRefDate);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const dayNumber = d.getDate();

        const schedules = allData[dateStr] || [];
        const total = schedules.length;
        const approved = schedules.filter(s => s.isApproved).length;
        const hasLate = schedules.some(s => s.isApproved && s.isLate);

        totalSlotsCount += total;
        totalApprovedCount += approved;

        let statusBg = 'bg-slate-800 text-slate-500 border-slate-700/60';
        if (total > 0) {
          if (approved === total) {
            statusBg = hasLate ? 'bg-amber-400 text-slate-950 font-bold border-amber-300' : 'bg-emerald-500 text-slate-950 font-bold border-emerald-400';
          } else if (approved > 0) {
            statusBg = 'bg-indigo-600 text-white font-medium border-indigo-400';
          } else {
            statusBg = 'bg-rose-900/60 text-rose-300 border-rose-800';
          }
        }

        const isCurrentActive = (dateStr === currentDate);

        const dayCell = document.createElement('div');
        dayCell.className = `h-7 rounded flex flex-col items-center justify-center cursor-pointer border transition text-[9px] select-none ${statusBg} ${
          isCurrentActive ? 'ring-2 ring-white scale-105 z-10' : 'hover:opacity-80'
        }`;
        dayCell.title = `${dateStr} (${approved}/${total} Selesai)`;
        dayCell.innerHTML = `<span>${dayNumber}</span>`;
        dayCell.onclick = () => {
          datePicker.value = dateStr;
          currentDate = dateStr;
          render();
        };

        grid.appendChild(dayCell);
      }

      const totalRate = totalSlotsCount > 0 ? Math.round((totalApprovedCount / totalSlotsCount) * 100) : 0;
      document.getElementById('monthlyStatsText').innerText = `30 Hari: ${totalApprovedCount}/${totalSlotsCount} (${totalRate}%)`;
    }

    function render() {
      const schedules = getSchedulesForDate(currentDate);
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      let approvedCount = 0;
      schedules.sort((a, b) => a.time.localeCompare(b.time));

      schedules.forEach(item => {
        if (item.isApproved) approvedCount++;

        const countdown = getRemainingTimeText(item.time, currentDate);
        const isScheduleLate = !item.isApproved && countdown.isPassed;

        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border transition-all ${
          item.isApproved 
            ? 'bg-emerald-950/20 border-emerald-900/50 text-slate-300' 
            : isScheduleLate
              ? 'bg-rose-950/20 border-rose-900/40 shadow-sm'
              : 'bg-slate-900/90 border-slate-800 shadow-sm'
        }`;

        let badgeHtml = '';
        if (item.platform === 'ALL' || item.platform === 'FB') {
          badgeHtml += `<span class="text-[9px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-1 py-0.2 rounded">FB</span> `;
        }
        if (item.platform === 'ALL' || item.platform === 'YT') {
          badgeHtml += `<span class="text-[9px] font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 px-1 py-0.2 rounded">YT</span>`;
        }

        let statusTextHtml = '';
        if (item.isApproved) {
          statusTextHtml = `
            <div class="flex items-center gap-1 text-[9.5px] text-emerald-400 mt-1">
              <i data-lucide="check" class="w-3 h-3"></i> Approved ${item.approvedAt} WIB
              ${item.isLate ? '<span class="text-[8px] bg-amber-500/20 text-amber-300 px-1 py-0.2 rounded ml-1">Telat</span>' : ''}
            </div>
          `;
        } else if (isScheduleLate) {
          statusTextHtml = `<div class="text-[9.5px] text-rose-400 mt-1 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Terlewat! Segera Posting</div>`;
        } else {
          statusTextHtml = `<div class="text-[9.5px] text-amber-400/90 font-mono mt-1 flex items-center gap-1"><i data-lucide="timer" class="w-3 h-3"></i> Hitung mundur: <strong>${countdown.text}</strong></div>`;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-xs text-white">${item.time} WIB</span>
                <div class="flex gap-0.5">${badgeHtml}</div>
                <span class="text-[9px] bg-slate-800 text-indigo-300 border border-slate-700 px-1.5 py-0.2 rounded truncate max-w-[110px]">${item.channel || 'Akun Utama'}</span>
              </div>
              <p class="text-[11px] text-slate-200 mt-0.5 font-medium truncate">${item.title}</p>
              ${statusTextHtml}
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button 
                onclick="toggleApprove('${item.id}')"
                class="px-2.5 py-1.5 rounded-lg text-[10px] font-semibold flex items-center gap-1 transition ${
                  item.isApproved 
                    ? 'bg-slate-800 text-slate-300' 
                    : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow'
                }">
                <i data-lucide="${item.isApproved ? 'rotate-ccw' : 'check'}" class="w-3 h-3"></i>
                ${item.isApproved ? 'Batal' : 'Approve'}
              </button>
              
              <button onclick="deleteSchedule('${item.id}')" class="p-1 text-slate-500 hover:text-rose-400 transition" title="Hapus">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      const total = schedules.length;
      const percentage = total > 0 ? Math.round((approvedCount / total) * 100) : 0;
      document.getElementById('progressText').innerText = `${approvedCount}/${total} (${percentage}%)`;
      document.getElementById('progressBar').style.width = `${percentage}%`;

      render30DayGrid();
      lucide.createIcons();
    }

    function toggleApprove(id) {
      const allData = getStoredData();
      const list = allData[currentDate] || [];
      const item = list.find(x => x.id === id);
      if (item) {
        item.isApproved = !item.isApproved;
        if (item.isApproved) {
          const now = new Date();
          item.approvedAt = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

          const [schHour, schMin] = item.time.split(':').map(Number);
          const currentHour = now.getHours();
          const currentMin = now.getMinutes();
          item.isLate = (currentHour > schHour) || (currentHour === schHour && currentMin > schMin);
        } else {
          item.approvedAt = null;
          item.isLate = false;
        }
        saveData(allData);
        render();
      }
    }

    function deleteSchedule(id) {
      const allData = getStoredData();
      if (allData[currentDate]) {
        allData[currentDate] = allData[currentDate].filter(x => x.id !== id);
        saveData(allData);
        render();
      }
    }

    function openAddModal() {
      document.getElementById('modalBackdrop').classList.remove('hidden');
      document.getElementById('modalBackdrop').classList.add('flex');
    }
    function closeAddModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
      document.getElementById('modalBackdrop').classList.remove('flex');
    }

    function addNewSchedule() {
      const time = document.getElementById('newTime').value;
      const platform = document.getElementById('newPlatform').value;
      const channel = document.getElementById('newChannel').value.trim() || 'Akun Utama';
      const title = document.getElementById('newTitle').value.trim() || 'Konten Harian';

      if (!time) {
        alert('Pilih jam tayang.');
        return;
      }

      const allData = getStoredData();
      if (!allData[currentDate]) {
        getSchedulesForDate(currentDate);
      }

      allData[currentDate].push({
        id: 'item_' + Date.now(),
        time,
        platform,
        channel,
        title,
        isApproved: false,
        approvedAt: null,
        isLate: false
      });

      saveData(allData);
      closeAddModal();
      document.getElementById('newTime').value = '';
      document.getElementById('newChannel').value = '';
      document.getElementById('newTitle').value = '';
      render();
    }

    datePicker.addEventListener('change', (e) => {
      currentDate = e.target.value;
      render();
    });

    setInterval(() => {
      const schedules = getStoredData()[currentDate] || [];
      if (schedules.some(s => !s.isApproved)) {
        render();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
