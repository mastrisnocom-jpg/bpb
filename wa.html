<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pembaruan - M-Ops Workspace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wa: {
                            bg: '#0b141a',
                            surface: '#111b21',
                            card: '#1f2c34',
                            hover: '#202c33',
                            green: '#25d366',
                            greenDark: '#00a884',
                            activePill: '#103629',
                            text: '#e9edef',
                            subtext: '#8696a0',
                            border: '#222d34'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#0b141a] text-[#e9edef] min-h-screen flex justify-center selection:bg-[#00a884] selection:text-white">

    <!-- SCREEN AUTHENTICATION -->
    <div id="auth-screen" class="fixed inset-0 bg-[#0b141a]/95 backdrop-blur-md z-[100] flex flex-col items-center justify-center hidden p-4">
        <div class="bg-[#1f2c34] p-6 rounded-[28px] shadow-2xl w-full max-w-xs text-center border border-[#2a3942] animate-pop">
            <div class="w-12 h-12 bg-[#25d366] text-[#0b141a] rounded-2xl flex items-center justify-center text-xl mx-auto mb-3 shadow-md font-black">B</div>
            <h2 id="auth-title" class="text-lg font-extrabold text-[#e9edef] mb-0.5">Binayasa M-Ops</h2>
            <p id="auth-subtitle" class="text-[10px] font-medium text-[#8696a0] mb-5">Workspace Saluran & Aktivitas Kerja</p>
            
            <div id="form-container" class="space-y-2.5">
                <input type="email" id="input-email" placeholder="Alamat Email" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3.5 py-2.5 text-center text-xs text-white font-semibold focus:outline-none focus:border-[#25d366] transition">
                <input type="password" id="input-password" placeholder="Kata Sandi" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3.5 py-2.5 text-center text-xs text-white font-semibold focus:outline-none focus:border-[#25d366] transition">
            </div>
            
            <p id="auth-error" class="text-[10px] text-rose-400 font-bold mt-2.5 hidden leading-snug">Error message</p>
            <button id="btn-action" class="w-full bg-[#25d366] text-[#0b141a] font-bold py-2.5 rounded-xl hover:bg-[#00a884] active:scale-95 transition text-xs shadow-md mt-4">Masuk</button>
            
            <button id="btn-switch" class="text-[#8696a0] text-[10px] font-bold mt-4 hover:text-[#25d366] transition block mx-auto">Belum punya akun? Daftar sekarang.</button>
        </div>
    </div>

    <!-- CONTAINER UTAMA LAYOUT WHATSAPP -->
    <div id="app-dashboard" class="w-full max-w-md min-h-screen bg-[#0b141a] flex flex-col relative pb-20 shadow-2xl border-x border-[#1f2c34]/40 hidden">

        <!-- HEADER ATAS (PEMBARUAN) -->
        <header class="sticky top-0 z-40 bg-[#0b141a] px-4 pt-3.5 pb-2.5 flex items-center justify-between border-b border-[#1f2c34]/50">
            <h1 class="text-xl font-bold tracking-normal text-[#e9edef] select-none">Pembaruan</h1>
            <div class="flex items-center gap-5 text-[#8696a0]">
                <button onclick="toggleFilterDrawer()" class="hover:text-[#e9edef] active:scale-90 transition" title="Filter Tanggal">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
                <div class="relative">
                    <button onclick="toggleTopMenu()" class="hover:text-[#e9edef] active:scale-90 transition" title="Menu Opsi">
                        <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                    </button>
                    <!-- DROPDOWN 3-DOTS -->
                    <div id="topDropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-[#1f2c34] rounded-2xl shadow-2xl border border-[#2a3942] py-1.5 z-50 text-xs font-medium animate-pop">
                        <button onclick="openExportModal('pdf'); toggleTopMenu();" class="w-full text-left px-4 py-2.5 hover:bg-[#2a3942] flex items-center gap-2.5 text-[#e9edef]">
                            <i class="fa-solid fa-file-pdf text-rose-400"></i> Export PDF Laporan
                        </button>
                        <button onclick="openExportModal('csv'); toggleTopMenu();" class="w-full text-left px-4 py-2.5 hover:bg-[#2a3942] flex items-center gap-2.5 text-[#e9edef]">
                            <i class="fa-solid fa-file-csv text-emerald-400"></i> Export CSV
                        </button>
                        <button id="menuSuperadminBudget" onclick="openBudgetConfigModal(); toggleTopMenu();" class="hidden w-full text-left px-4 py-2.5 hover:bg-[#2a3942] flex items-center gap-2.5 text-amber-300">
                            <i class="fa-solid fa-coins"></i> Pengaturan Anggaran
                        </button>
                        <div class="border-t border-[#2a3942] my-1"></div>
                        <button onclick="logout()" class="w-full text-left px-4 py-2.5 hover:bg-rose-900/30 flex items-center gap-2.5 text-rose-400">
                            <i class="fa-solid fa-right-from-bracket"></i> Keluar Akun
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ACCORDION FILTER TANGGAL -->
        <div id="filterSearchDrawer" class="hidden bg-[#111b21] border-b border-[#1f2c34] p-3 animate-pop">
            <div class="flex items-center justify-between gap-2">
                <span class="text-[10px] text-[#8696a0] font-bold uppercase">Filter Tanggal:</span>
                <input type="date" id="dateFilter" onchange="renderTasks()" class="bg-[#1f2c34] border border-[#2a3942] text-[11px] font-bold rounded-lg px-2.5 py-1 text-white focus:outline-none focus:border-[#25d366]">
            </div>
        </div>

        <!-- AREA KONTEN SCROLLABLE -->
        <main class="flex-1 overflow-y-auto px-4 pt-3 pb-16 space-y-5">

            <!-- SEKSI 1: STATUS STORIES CAROUSEL -->
            <section>
                <h2 class="text-base font-bold text-[#e9edef] mb-3">Status</h2>
                <div id="statusStoriesRow" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar pb-1 snap-x"></div>
            </section>

            <!-- SEKSI 2: SALURAN & TUGAS KERJA -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-[#e9edef]">Saluran</h2>
                    <button onclick="openAutoGenerateModal()" class="bg-[#1f2c34] hover:bg-[#2a3942] active:scale-95 text-[#e9edef] text-xs font-bold px-3.5 py-1.5 rounded-full transition border border-[#2a3942] flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles text-[#25d366]"></i> AI Plan
                    </button>
                </div>

                <div id="taskChannelList" class="space-y-1 divide-y divide-[#1f2c34]/60"></div>
            </section>
        </main>

        <!-- FLOATING ACTION BUTTONS -->
        <div class="fixed bottom-20 right-4 sm:right-[calc(50%-200px)] flex flex-col items-center gap-3.5 z-40">
            <button onclick="openBulkTextModal()" title="Import Teks WA" class="w-10 h-10 rounded-xl bg-[#202c33] hover:bg-[#2a3942] active:scale-90 text-[#e9edef] flex items-center justify-center shadow-lg border border-[#2a3942] transition">
                <i class="fa-solid fa-pen text-sm"></i>
            </button>
            <button onclick="openTaskModal()" title="Tambah Single Task" class="w-14 h-14 rounded-2xl bg-[#25d366] hover:bg-[#00a884] active:scale-90 text-[#0b141a] flex items-center justify-center shadow-2xl transition">
                <i class="fa-solid fa-camera text-xl font-bold"></i>
            </button>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="fixed bottom-0 w-full max-w-md bg-[#0b141a] border-t border-[#1f2c34] flex items-center justify-around py-2 z-40 select-none">
            <button onclick="openGlobalChatModal()" class="flex flex-col items-center gap-0.5 group">
                <div class="relative py-1 px-4 rounded-full transition group-active:scale-95">
                    <i class="fa-regular fa-comment-dots text-xl text-[#8696a0]"></i>
                    <span id="chatBadgeCount" class="hidden absolute top-0 right-1 bg-[#25d366] text-[#0b141a] text-[9.5px] font-black min-w-[17px] h-[17px] rounded-full flex items-center justify-center px-1">0</span>
                </div>
                <span class="text-[11px] font-semibold text-[#8696a0]">Chat</span>
            </button>

            <button onclick="goToHomeJadwal()" class="flex flex-col items-center gap-0.5">
                <div class="py-0.5 px-4 rounded-full bg-[#103629] text-[#25d366]">
                    <i class="fa-solid fa-rotate-right text-lg font-bold"></i>
                </div>
                <span class="text-[11px] font-bold text-[#e9edef]">Pembaruan</span>
            </button>

            <button onclick="openEarningsModal()" class="flex flex-col items-center gap-0.5 group">
                <div class="py-1 px-4 rounded-full text-[#8696a0] group-hover:text-[#e9edef] transition group-active:scale-95">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <span class="text-[11px] font-semibold text-[#8696a0]">Insentif</span>
            </button>

            <button onclick="openProfileModal()" class="flex flex-col items-center gap-0.5 group">
                <div class="py-1 px-4 rounded-full text-[#8696a0] group-hover:text-[#e9edef] transition group-active:scale-95">
                    <i class="fa-regular fa-user text-xl"></i>
                </div>
                <span class="text-[11px] font-semibold text-[#8696a0]">Profil</span>
            </button>
        </nav>
    </div>

    <!-- MODAL: FORM SINGLE TASK -->
    <div id="scheduleModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <form id="scheduleForm" class="bg-[#1f2c34] w-full max-w-sm rounded-[24px] border border-[#2a3942] p-4 text-xs space-y-3 shadow-2xl animate-pop">
            <div class="flex items-center justify-between pb-2 border-b border-[#2a3942]">
                <h3 class="font-bold text-sm text-[#e9edef]" id="modalTitle">Tambah Aktivitas Baru</h3>
                <button type="button" onclick="toggleModal(false)" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Tanggal</label>
                <input type="date" id="input-date" required class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2.5 py-1.5 text-white mt-0.5">
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Nama Petugas (Sesuai Akun)</label>
                <input type="text" id="input-name" readonly class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-1.5 text-[#8696a0] cursor-not-allowed mt-0.5">
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Kategori / Peran</label>
                <select id="input-role" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2.5 py-1.5 text-white mt-0.5">
                    <option value="Teknisi">Teknisi</option>
                    <option value="Cleaning">Cleaning Service</option>
                    <option value="Admin">Admin Teknik</option>
                    <option value="Personal">Personal / Umum</option>
                </select>
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Rincian Kegiatan</label>
                <input type="text" id="input-task" required placeholder="Contoh: Perbaikan panel listrik" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-2 text-white focus:outline-none focus:border-[#25d366] mt-0.5">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-[#8696a0] font-bold">Jam Mulai</label>
                    <input type="time" id="input-start-time" value="08:00" required class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2.5 py-1.5 text-white mt-0.5">
                </div>
                <div>
                    <label class="text-[10px] text-[#8696a0] font-bold">Jam Selesai</label>
                    <input type="time" id="input-end-time" value="10:00" required class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2.5 py-1.5 text-white mt-0.5">
                </div>
            </div>

            <button type="submit" id="btn-save-task" class="w-full bg-[#25d366] hover:bg-[#00a884] text-[#0b141a] font-bold py-2.5 rounded-xl transition active:scale-95 shadow-md">
                Simpan Aktivitas
            </button>
        </form>
    </div>

    <!-- MODAL: DOKUMENTASI FOTO SELESAI (BEFORE & AFTER) -->
    <div id="completionNoteModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <form id="formCompletionNote" class="bg-[#1f2c34] w-full max-w-sm rounded-[24px] border border-[#2a3942] p-4 text-xs space-y-3 shadow-2xl animate-pop max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-[#2a3942]">
                <h3 class="font-bold text-sm text-[#e9edef]">Selesaikan Tugas & Bukti Foto</h3>
                <button type="button" onclick="closeCompletionNoteModal()" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <input type="hidden" id="complete-task-id">

            <div>
                <p class="text-[10px] text-[#8696a0] font-bold">Tugas:</p>
                <p id="complete-task-title" class="font-bold text-white bg-[#111b21] p-2 rounded-xl mt-0.5">-</p>
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Catatan Penyelesaian</label>
                <textarea id="complete-task-note" rows="2" placeholder="Tulis hasil pekerjaan..." class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl p-2 text-white focus:outline-none focus:border-[#25d366] mt-0.5"></textarea>
            </div>

            <div class="space-y-2 pt-1 border-t border-[#2a3942]">
                <div>
                    <label class="text-[10px] text-[#8696a0] font-bold block mb-0.5">📷 Foto Sebelum (Before)</label>
                    <input type="file" id="complete-file-before" accept="image/*" class="w-full text-[10px] text-[#8696a0] file:bg-[#111b21] file:text-white file:border-0 file:rounded-lg file:px-2 file:py-1">
                </div>
                <div>
                    <label class="text-[10px] text-[#25d366] font-bold block mb-0.5">✅ Foto Sesudah (After)</label>
                    <input type="file" id="complete-file-after" accept="image/*" class="w-full text-[10px] text-[#8696a0] file:bg-[#25d366] file:text-[#0b141a] file:font-bold file:border-0 file:rounded-lg file:px-2 file:py-1">
                </div>
            </div>

            <button type="submit" id="btn-submit-completion" class="w-full bg-[#25d366] hover:bg-[#00a884] text-[#0b141a] font-bold py-2.5 rounded-xl transition active:scale-95 shadow-md">
                Simpan & Upload
            </button>
        </form>
    </div>

    <!-- MODAL: EXPORT LAPORAN -->
    <div id="exportModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1f2c34] w-full max-w-sm rounded-[24px] border border-[#2a3942] p-4 text-xs space-y-3.5 shadow-2xl animate-pop">
            <div class="flex items-center justify-between pb-2 border-b border-[#2a3942]">
                <h3 class="font-bold text-sm text-[#e9edef]">Unduh Laporan Kerja</h3>
                <button onclick="closeExportModal()" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <div class="space-y-1">
                <label class="text-[10.5px] text-[#8696a0] font-bold">Format Dokumen</label>
                <select id="exportPdfType" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-2 text-[#e9edef] font-semibold focus:outline-none">
                    <option value="with_photos">📸 PDF Lengkap + Foto (Before & After)</option>
                    <option value="text_only">📄 PDF Hanya Teks (Tabel Ringkas)</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-[10.5px] text-[#8696a0] font-bold">Periode Waktu</label>
                <select id="exportRangeType" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-2 text-[#e9edef] font-semibold focus:outline-none">
                    <option value="daily">📅 Hari Ini</option>
                    <option value="weekly">📆 7 Hari Terakhir</option>
                    <option value="monthly">🗓️ Bulan Ini</option>
                </select>
            </div>

            <button id="btnExecuteExport" onclick="processExportExecution()" class="w-full bg-[#25d366] hover:bg-[#00a884] text-[#0b141a] font-bold py-2.5 rounded-xl transition active:scale-95 shadow-md">
                Unduh Sekarang
            </button>
        </div>
    </div>

    <!-- MODAL: AUTO GENERATE AI GEMINI -->
    <div id="autoGenerateModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1f2c34] w-full max-w-sm rounded-[24px] border border-[#2a3942] p-4 text-xs space-y-3 shadow-2xl animate-pop max-h-[85vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-2 border-b border-[#2a3942]">
                <h3 class="font-bold text-sm text-[#e9edef] flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-[#25d366]"></i> AI Smart Planner</h3>
                <button onclick="closeAutoGenerateModal()" class="text-[#8696a0] hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Kunci Gemini API</label>
                <input type="password" id="userGeminiApiKey" placeholder="Tempel AIzaSy..." onchange="saveGeminiApiKey(this.value)" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-1.5 text-white font-mono mt-0.5">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-[#8696a0] font-bold">Tanggal</label>
                    <input type="date" id="gen-date" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2.5 py-1.5 text-white mt-0.5">
                </div>
                <div>
                    <label class="text-[10px] text-[#8696a0] font-bold">Profesi</label>
                    <select id="gen-role" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-2 py-1.5 text-white mt-0.5">
                        <option value="Teknisi Gedung">Teknisi</option>
                        <option value="Cleaning Service">Cleaning</option>
                        <option value="Admin Kantor">Admin</option>
                        <option value="Personal / Mahasiswa">Personal</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-[10px] text-[#8696a0] font-bold">Fokus Aktivitas / Target</label>
                <input type="text" id="gen-focus" placeholder="Contoh: Perbaikan AC dan pembersihan filter" class="w-full bg-[#111b21] border border-[#2a3942] rounded-xl px-3 py-1.5 text-white mt-0.5">
            </div>

            <button id="btn-process-gen" onclick="generateAiSchedulePreview()" class="w-full bg-[#25d366] hover:bg-[#00a884] text-[#0b141a] font-bold py-2 rounded-xl active:scale-95 transition">
                Rancang Jadwal AI
            </button>

            <div id="aiPreviewList" class="space-y-1.5 pt-2 hidden"></div>
            <button id="btn-save-ai-tasks" onclick="saveAllAiTasks()" class="w-full bg-[#00a884] text-white font-bold py-2 rounded-xl hidden">Simpan ke Saluran</button>
        </div>
    </div>

    <!-- TOAST NOTIFIKASI -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-[#202c33] text-white text-[11px] font-bold px-4 py-2 rounded-full shadow-xl transition-opacity duration-300 opacity-0 pointer-events-none z-[110] border border-[#2a3942]">Pesan</div>

    <!-- SCRIPT JAVASCRIPT LOGIKA REAL SUPABASE & FITUR -->
    <script>
        const SUPABASE_URL = 'https://fmlotqntqxbmsvivvgnw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xcjfrcsPC9WV3mlwKeZ2_Q_e5vjsroM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const SUPER_ADMIN_EMAIL = 'mastrisnocom@gmail.com';
        const UNIT_NAME = 'BPB Unit BSN KC Surabaya';

        let currentUser = null;
        let globalTasks = [];
        let previewTasksData = [];
        let isSuperAdmin = false;
        let userProfilesMap = {};
        const todayStr = new Date().toISOString().slice(0, 10);

        function getUserDisplayName(userId, fallbackEmail = '', fallbackName = '') {
            if (userId && userProfilesMap[userId]) return userProfilesMap[userId];
            if (userId === currentUser?.id) {
                const name = currentUser?.user_metadata?.full_name || currentUser?.user_metadata?.name;
                if (name) return name;
            }
            if (fallbackName && fallbackName.trim()) return fallbackName.trim();
            if (fallbackEmail) return fallbackEmail.split('@')[0];
            return 'Petugas BPB';
        }

        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                if (currentUser.email === SUPER_ADMIN_EMAIL) {
                    isSuperAdmin = true;
                    document.getElementById('menuSuperadminBudget')?.classList.remove('hidden');
                }
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-dashboard').classList.remove('hidden');
                initApp();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        document.getElementById('btn-action').onclick = async () => {
            const email = document.getElementById('input-email').value;
            const password = document.getElementById('input-password').value;
            const errEl = document.getElementById('auth-error');
            if (!email || !password) { errEl.innerText = "Email dan Password wajib diisi!"; errEl.classList.remove('hidden'); return; }
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errEl.innerText = error.message;
                errEl.classList.remove('hidden');
            } else {
                currentUser = data.user;
                checkAuth();
            }
        };

        async function initApp() {
            document.getElementById('input-date').value = todayStr;
            document.getElementById('gen-date').value = todayStr;
            document.getElementById('dateFilter').value = todayStr;
            document.getElementById('input-name').value = getUserDisplayName(currentUser.id, currentUser.email);
            
            const savedKey = localStorage.getItem('user_gemini_api_key') || '';
            const keyInput = document.getElementById('userGeminiApiKey');
            if (keyInput) keyInput.value = savedKey;

            await fetchTasks();
            setupRealtime();
        }

        async function fetchTasks() {
            const { data, error } = await _supabase.from('jadwal').select('*').order('created_at', { ascending: false });
            if (!error && data) {
                globalTasks = data;
                renderUI();
            }
        }

        function setupRealtime() {
            _supabase.channel('public:jadwal')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'jadwal' }, () => { fetchTasks(); })
                .subscribe();
        }

        function renderUI() {
            renderStatusStories();
            renderChannelTasks();
        }

        function renderStatusStories() {
            const container = document.getElementById('statusStoriesRow');
            container.innerHTML = '';

            const userStoriesMap = {};
            globalTasks.forEach(task => {
                if (task.foto_sesudah || task.foto_sebelum) {
                    if (!userStoriesMap[task.user_id]) {
                        userStoriesMap[task.user_id] = {
                            name: getUserDisplayName(task.user_id, task.user_email, task.nama),
                            photo: task.foto_sesudah || task.foto_sebelum,
                            tugas: task.tugas,
                            initials: (task.nama || 'P').substring(0, 2).toUpperCase()
                        };
                    }
                }
            });

            const storyUsers = Object.values(userStoriesMap);
            if (storyUsers.length === 0) {
                container.innerHTML = `
                    <div class="w-full py-4 text-center text-[#8696a0] text-xs bg-[#111b21] rounded-2xl border border-[#2a3942]/60">
                        Belum ada status/dokumentasi foto kerja hari ini.
                    </div>
                `;
                return;
            }

            storyUsers.forEach(s => {
                const card = document.createElement('div');
                card.className = `w-24 h-40 rounded-2xl flex-shrink-0 bg-[#1f2c34] p-2 flex flex-col justify-between relative overflow-hidden border border-[#2a3942] cursor-pointer active:scale-95 transition shadow-md snap-start group`;
                card.innerHTML = `
                    <img src="${s.photo}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/90 pointer-events-none"></div>
                    <div class="z-10 w-8 h-8 rounded-full border-2 border-[#25d366] p-0.5 bg-[#0b141a] flex items-center justify-center font-bold text-[10px] text-[#25d366]">
                        ${s.initials}
                    </div>
                    <div class="z-10">
                        <p class="text-[10px] text-white font-bold leading-tight line-clamp-2">${s.tugas}</p>
                        <p class="text-[9px] text-[#8696a0] truncate mt-0.5">${s.name}</p>
                    </div>
                `;
                card.onclick = () => showToast(`Status: ${s.name} - ${s.tugas}`);
                container.appendChild(card);
            });
        }

        function renderChannelTasks() {
            const container = document.getElementById('taskChannelList');
            const selectedDate = document.getElementById('dateFilter').value;
            container.innerHTML = '';

            const filtered = globalTasks.filter(t => !selectedDate || t.tanggal === selectedDate);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-xs text-[#8696a0]">Belum ada jadwal pada tanggal ini.</div>';
                return;
            }

            filtered.forEach(task => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between py-3 cursor-pointer hover:bg-[#1f2c34]/40 px-1 rounded-xl transition';
                
                const initials = (task.nama || 'P').substring(0, 2).toUpperCase();
                const isCompleted = task.status === 'Selesai';

                row.innerHTML = `
                    <div class="flex items-center gap-3.5 min-w-0 flex-1">
                        <div class="w-12 h-12 rounded-full bg-[#1f2c34] border border-[#2a3942] flex items-center justify-center font-bold text-sm text-[#25d366] flex-shrink-0">
                            ${initials}
                        </div>
                        <div class="min-w-0 flex-1">
                            <h4 class="font-bold text-sm text-[#e9edef] truncate">${getUserDisplayName(task.user_id, task.user_email, task.nama)}</h4>
                            <p class="text-xs text-[#8696a0] truncate mt-0.5 flex items-center gap-1">
                                ${isCompleted ? '<i class="fa-solid fa-check-double text-[#25d366] text-[10px]"></i>' : '<i class="fa-regular fa-clock text-[10px]"></i>'}
                                <span>${task.tugas}</span>
                            </p>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end gap-1 flex-shrink-0 pl-2">
                        <span class="text-[11px] font-medium ${isCompleted ? 'text-[#25d366]' : 'text-[#8696a0]'}">${task.jam_mulai || '08:00'}</span>
                        <button onclick="openCompletionModal('${task.id}', '${task.tugas.replace(/'/g, "\\'")}')" class="text-[10px] bg-[#1f2c34] hover:bg-[#25d366] hover:text-[#0b141a] text-[#8696a0] px-2 py-0.5 rounded-full border border-[#2a3942] transition font-bold">
                            ${task.status}
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // FUNGSI FORM TAMBAH JADWAL
        document.getElementById('scheduleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const tugas = document.getElementById('input-task').value;
            const jam_mulai = document.getElementById('input-start-time').value;
            const jam_selesai = document.getElementById('input-end-time').value;
            const tanggal = document.getElementById('input-date').value;
            const peran = document.getElementById('input-role').value;
            const nama = getUserDisplayName(currentUser.id, currentUser.email);

            const payload = { 
                user_id: currentUser.id, 
                user_email: currentUser.email,
                nama, 
                tugas, 
                jam_mulai, 
                jam_selesai, 
                tanggal,
                peran,
                status: 'Belum', 
                created_at: new Date().toISOString() 
            };
            
            await _supabase.from('jadwal').insert([payload]);
            toggleModal(false);
            showToast("Jadwal baru tersimpan!");
            fetchTasks();
        });

        // FUNGSI WATERMARK & KOMPRESI GAMBAR
        async function processAndWatermarkImage(file, userName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const MAX_DIMENSION = 1200;
                        if (width > height && width > MAX_DIMENSION) { height = Math.round((height * MAX_DIMENSION) / width); width = MAX_DIMENSION; } 
                        else if (height > MAX_DIMENSION) { width = Math.round((width * MAX_DIMENSION) / height); height = MAX_DIMENSION; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const now = new Date();
                        const timeStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');
                        const bannerHeight = Math.max(45, Math.round(height * 0.08));
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; 
                        ctx.fillRect(0, height - bannerHeight, width, bannerHeight);
                        ctx.fillStyle = '#25d366'; 
                        ctx.fillRect(0, height - bannerHeight, width, 3);
                        ctx.fillStyle = '#ffffff'; 
                        ctx.font = `bold ${Math.max(12, Math.round(bannerHeight * 0.3))}px sans-serif`;
                        ctx.fillText(`👤 ${userName} | 🏢 ${UNIT_NAME}`, 14, height - (bannerHeight * 0.55));
                        ctx.font = `normal ${Math.max(10, Math.round(bannerHeight * 0.25))}px sans-serif`;
                        ctx.fillText(`🕒 ${timeStr}`, 14, height - (bannerHeight * 0.2));

                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
                    };
                    img.onerror = (e) => reject(e);
                };
                reader.onerror = (e) => reject(e);
            });
        }

        async function uploadEvidence(blob, prefix) {
            if (!blob) return null;
            const fileName = `${prefix}_${currentUser.id}_${Date.now()}.jpg`;
            const filePath = `evidences/${fileName}`;
            const { error } = await _supabase.storage.from('task-evidences').upload(filePath, blob, { contentType: 'image/jpeg', upsert: true });
            if (error) return null;
            return _supabase.storage.from('task-evidences').getPublicUrl(filePath).data?.publicUrl || null;
        }

        // FUNGSI PENYELESAIAN TUGAS
        document.getElementById('formCompletionNote').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('complete-task-id').value;
            const note = document.getElementById('complete-task-note').value;
            const beforeFile = document.getElementById('complete-file-before').files[0];
            const afterFile = document.getElementById('complete-file-after').files[0];
            const btn = document.getElementById('btn-submit-completion');

            btn.innerText = "Mengunggah...";
            btn.disabled = true;

            try {
                let urlBefore = null, urlAfter = null;
                const userName = getUserDisplayName(currentUser.id, currentUser.email);

                if (beforeFile) {
                    const blobB = await processAndWatermarkImage(beforeFile, userName);
                    urlBefore = await uploadEvidence(blobB, 'before');
                }
                if (afterFile) {
                    const blobA = await processAndWatermarkImage(afterFile, userName);
                    urlAfter = await uploadEvidence(blobA, 'after');
                }

                await _supabase.from('jadwal').update({ 
                    status: 'Selesai', 
                    keterangan: note, 
                    foto_sebelum: urlBefore, 
                    foto_sesudah: urlAfter,
                    completed_at: new Date().toISOString() 
                }).eq('id', id);

                closeCompletionNoteModal();
                showToast("Tugas selesai & dokumentasi tersimpan!");
                fetchTasks();
            } catch (err) {
                alert("Error upload: " + err.message);
            } finally {
                btn.innerText = "Simpan & Upload";
                btn.disabled = false;
            }
        });

        // FUNGSI GENERATOR PDF (TEKS / LENGKAP FOTO)
        async function processExportExecution() {
            const pdfType = document.getElementById('exportPdfType').value;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();

            doc.setFontSize(14);
            doc.text("LAPORAN AKTIVITAS & TARGET KERJA", 14, 15);
            doc.setFontSize(9);
            doc.text(`Unit: ${UNIT_NAME} | Tipe: ${pdfType === 'with_photos' ? 'Lengkap Foto' : 'Teks Ringkas'}`, 14, 21);

            if (pdfType === 'text_only') {
                const rows = globalTasks.map((t, idx) => [idx + 1, t.tanggal, t.jam_mulai + '-' + t.jam_selesai, getUserDisplayName(t.user_id, t.user_email, t.nama), t.tugas, t.status]);
                doc.autoTable({ startY: 26, head: [['No', 'Tanggal', 'Waktu', 'Petugas', 'Kegiatan', 'Status']], body: rows });
            } else {
                let y = 28;
                for (let t of globalTasks) {
                    if (y > 240) { doc.addPage(); y = 15; }
                    doc.setFontSize(10);
                    doc.text(`${t.tanggal} | ${t.jam_mulai}-${t.jam_selesai} | ${getUserDisplayName(t.user_id, t.user_email, t.nama)} [${t.status}]`, 14, y);
                    doc.setFontSize(9);
                    doc.text(`Tugas: ${t.tugas} (Ket: ${t.keterangan || '-'})`, 14, y + 5);
                    y += 18;
                }
            }

            doc.save(`Laporan_Kerja_${Date.now()}.pdf`);
            closeExportModal();
            showToast("PDF Berhasil diunduh!");
        }

        // FUNGSI AI GENERATE GEMINI
        function saveGeminiApiKey(k) { localStorage.setItem('user_gemini_api_key', k.trim()); showToast("Kunci API tersimpan!"); }

        async function generateAiSchedulePreview() {
            const apiKey = localStorage.getItem('user_gemini_api_key');
            if (!apiKey) return alert("Tempelkan Kunci API Gemini Anda terlebih dahulu!");
            
            const btn = document.getElementById('btn-process-gen');
            btn.innerText = "Merancang...";
            btn.disabled = true;

            const prompt = `Buatkan 4 jadwal realistis untuk ${document.getElementById('gen-role').value} tanggal ${document.getElementById('gen-date').value}. Respon murni format JSON array: [{"jam_mulai":"08:00","jam_selesai":"10:00","tugas":"Rincian"}]`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
                text = text.replace(/```json|```/gi, '').trim();
                previewTasksData = JSON.parse(text);

                const list = document.getElementById('aiPreviewList');
                list.innerHTML = '';
                previewTasksData.forEach(p => {
                    list.innerHTML += `<div class="p-2 bg-[#111b21] rounded-xl text-white"><b>${p.jam_mulai}-${p.jam_selesai}:</b> ${p.tugas}</div>`;
                });
                list.classList.remove('hidden');
                document.getElementById('btn-save-ai-tasks').classList.remove('hidden');
            } catch (err) {
                alert("Gagal merancang AI: " + err.message);
            } finally {
                btn.innerText = "Rancang Jadwal AI";
                btn.disabled = false;
            }
        }

        async function saveAllAiTasks() {
            const nama = getUserDisplayName(currentUser.id, currentUser.email);
            const tanggal = document.getElementById('gen-date').value;
            const peran = document.getElementById('gen-role').value;

            const payload = previewTasksData.map(p => ({
                user_id: currentUser.id,
                user_email: currentUser.email,
                nama,
                tugas: p.tugas,
                jam_mulai: p.jam_mulai,
                jam_selesai: p.jam_selesai,
                tanggal,
                peran,
                status: 'Belum',
                created_at: new Date().toISOString()
            }));

            await _supabase.from('jadwal').insert(payload);
            closeAutoGenerateModal();
            showToast("Semua jadwal AI berhasil disimpan!");
            fetchTasks();
        }

        function openEarningsModal() { alert("Dompet Insentif: Rp 120.000"); }
        function openProfileModal() { alert(`Akun Login: ${getUserDisplayName(currentUser?.id, currentUser?.email)}`); }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }

        checkAuth();
    </script>
