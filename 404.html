<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Halaman Tersesat di Alam Semesta</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Effect Blur Background -->
  <div class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-lg w-full text-center relative z-10 space-y-6 bg-slate-900/60 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl">
    
    <!-- Robot Lucu Animasi -->
    <div class="animate-float inline-block relative cursor-pointer" onclick="changeExpression()">
      <div class="w-32 h-32 md:w-40 md:h-40 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-3xl p-1 shadow-lg shadow-indigo-500/30 flex items-center justify-center mx-auto">
        <div class="w-full h-full bg-slate-900 rounded-[22px] flex flex-col items-center justify-center p-4 relative overflow-hidden">
          
          <!-- Antena Robot -->
          <div class="w-3 h-3 bg-rose-500 rounded-full animate-ping absolute top-2 right-4"></div>
          
          <!-- Mata Robot -->
          <div id="robotEyes" class="flex gap-4 mb-3">
            <div class="w-6 h-6 bg-cyan-400 rounded-full border-2 border-white animate-bounce"></div>
            <div class="w-6 h-6 bg-cyan-400 rounded-full border-2 border-white animate-bounce" style="animation-delay: 0.1s"></div>
          </div>
          
          <!-- Mulut Robot -->
          <div id="robotMouth" class="w-10 h-2 bg-slate-500 rounded-full transition-all duration-300"></div>
        </div>
      </div>
      <span class="text-[10px] text-slate-500 block mt-2">(Klik robotnya buat ganti muka!)</span>
    </div>

    <!-- Judul & Teks Humor -->
    <div class="space-y-2">
      <h1 class="text-6xl md:text-7xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-rose-400 to-amber-400">
        404
      </h1>
      <h2 class="text-xl md:text-2xl font-bold text-white">Waduh! Halamannya Hilang Kontak.</h2>
      
      <!-- Box Alasan Konyol -->
      <div class="bg-slate-800/80 border border-slate-700/60 p-4 rounded-2xl min-h-[70px] flex items-center justify-center">
        <p id="funnyReason" class="text-sm text-slate-300 font-semibold italic">
          "Mungkin halamannya lagi pergi beli kopi sebentar..."
        </p>
      </div>
    </div>

    <!-- Tombol Aksi -->
    <div class="flex flex-col sm:flex-row gap-3 pt-2">
      <button onclick="getRandomReason()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 px-4 rounded-xl text-xs transition border border-slate-700 active:scale-95">
        🎲 KenapaBisaHilang?
      </button>

      <a href="/" class="flex-1 bg-gradient-to-r from-indigo-500 to-blue-600 hover:from-indigo-600 hover:to-blue-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-lg shadow-indigo-500/25 transition active:scale-95 flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Pulang ke Markas</span>
      </a>
    </div>

  </div>

  <script>
    // Daftar alasan konyol kenapa 404
    const reasons = [
      "Mungkin halamannya lagi pergi beli kopi sebentar...",
      "Halaman ini diculik oleh alien dari galaksi Andromeda 🛸",
      "Kucing server ngeswipe halamannya sampai jatuh dari meja 🐾",
      "Kamu ngetik alamat websitenya sambil merem ya?",
      "Halamannya lagi ikut lomba lari maraton, belum balik.",
      "Opps! Halaman ini ditarik kembali oleh tim pengembang.",
      "Halamannya tidak ditemukan. Coba cek di bawah kasur!"
    ];

    // Ekspresi Robot
    const expressions = [
      { eyes: ['bg-cyan-400', 'bg-cyan-400'], mouth: 'w-10 h-2 bg-slate-500' },
      { eyes: ['bg-rose-500', 'bg-rose-500'], mouth: 'w-6 h-6 rounded-full bg-rose-500' },
      { eyes: ['bg-amber-400', 'bg-amber-400'], mouth: 'w-12 h-1 bg-amber-400 rotate-6' }
    ];

    let currentExp = 0;

    function getRandomReason() {
      const randomIndex = Math.floor(Math.random() * reasons.length);
      document.getElementById('funnyReason').innerText = `"${reasons[randomIndex]}"`;
      changeExpression();
    }

    function changeExpression() {
      currentExp = (currentExp + 1) % expressions.length;
      const mouth = document.getElementById('robotMouth');
      mouth.className = `${expressions[currentExp].mouth} transition-all duration-300`;
    }
  </script>
</body>
</html>
