<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Video Watermark Studio 9:16</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Montserrat:wght@700&family=Playfair+Display:wght@700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 1.25rem 2rem; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { display: flex; flex: 1; padding: 1.5rem 2rem; gap: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        .preview-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .canvas-wrapper {
            position: relative;
            width: 360px;
            height: 640px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
        }

        #previewCanvas { width: 100%; height: 100%; cursor: grab; }
        #previewCanvas:active { cursor: grabbing; }

        .hint { margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted); }
        
        .controls-panel {
            width: 380px;
            background-color: var(--bg-panel);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            border: 1px solid var(--border);
            overflow-y: auto;
            max-height: 85vh;
        }

        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 700; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        label { font-size: 0.85rem; color: var(--text-muted); }

        input[type="text"], select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            color: var(--text-main);
            outline: none;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        .custom-file-upload {
            border: 1px dashed var(--border);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background: rgba(51, 65, 85, 0.3);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="file"] { display: none; }
        input[type="color"] { width: 100%; height: 38px; border-radius: 8px; border: none; background: transparent; cursor: pointer; }
        input[type="range"] { accent-color: var(--accent); }

        .btn-group { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; }
        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background-color: var(--bg-input); color: var(--text-main); }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--bg-input);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            margin-top: 0.5rem;
        }
        .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s linear; }

        #exportStatus { font-size: 0.85rem; text-align: center; color: var(--accent); min-height: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>✦ Video Watermark Studio (Fast Export 9:16)</h1>
    </header>

    <div class="container">
        <div class="preview-section">
            <div class="canvas-wrapper">
                <canvas id="previewCanvas" width="1080" height="1920"></canvas>
            </div>
            <div class="hint">Geser watermark langsung di layar preview</div>
        </div>

        <div class="controls-panel">
            <div class="form-group">
                <div class="section-title">1. Sumber Video</div>
                <label class="custom-file-upload">
                    <span id="videoLabel">Pilih Video</span>
                    <input type="file" id="videoInput" accept="video/*">
                </label>
            </div>

            <div class="form-group">
                <div class="section-title">2. Pengaturan Watermark</div>
                <label>Tipe Watermark</label>
                <select id="watermarkType">
                    <option value="text">Teks</option>
                    <option value="image">Gambar / Logo</option>
                </select>
            </div>

            <div id="textControls">
                <div class="form-group">
                    <label>Teks</label>
                    <input type="text" id="wmText" value="@nama_kamu">
                </div>
                <div class="grid-2" style="margin-top:0.5rem;">
                    <div class="form-group">
                        <label>Font</label>
                        <select id="wmFont">
                            <option value="Plus Jakarta Sans">Jakarta Sans</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Playfair Display">Playfair</option>
                            <option value="Roboto Mono">Mono</option>
                            <option value="Arial">Arial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Warna</label>
                        <input type="color" id="wmColor" value="#ffffff">
                    </div>
                </div>
            </div>

            <div id="imageControls" style="display: none;">
                <div class="form-group">
                    <label>Upload Logo</label>
                    <label class="custom-file-upload">
                        <span id="logoLabel">Pilih Logo</span>
                        <input type="file" id="logoInput" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Ukuran: <span id="sizeValue">54</span>px</label>
                <input type="range" id="wmSize" min="20" max="250" value="54">
            </div>

            <div class="form-group">
                <label>Opasitas: <span id="opacityValue">85</span>%</label>
                <input type="range" id="wmOpacity" min="10" max="100" value="85">
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" id="playPauseBtn" disabled>▶ Putar Preview</button>
                <button class="btn" id="exportBtn" disabled>⚡ Download Video Cepat (HD)</button>
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div id="exportStatus"></div>
            </div>
        </div>
    </div>

    <video id="sourceVideo" style="display: none;" playsinline muted></video>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const video = document.getElementById('sourceVideo');

        // Resolusi Full HD 9:16 (1080x1920) untuk output tajam
        canvas.width = 1080;
        canvas.height = 1920;

        let watermark = {
            type: 'text',
            text: '@nama_kamu',
            font: 'Plus Jakarta Sans',
            color: '#ffffff',
            x: 540,
            y: 220,
            size: 54,
            opacity: 0.85,
            image: null
        };

        let isDragging = false;
        let isVideoLoaded = false;
        let isExporting = false;

        const videoInput = document.getElementById('videoInput');
        const logoInput = document.getElementById('logoInput');
        const watermarkType = document.getElementById('watermarkType');
        const textControls = document.getElementById('textControls');
        const imageControls = document.getElementById('imageControls');
        const wmText = document.getElementById('wmText');
        const wmFont = document.getElementById('wmFont');
        const wmColor = document.getElementById('wmColor');
        const wmSize = document.getElementById('wmSize');
        const wmOpacity = document.getElementById('wmOpacity');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const exportBtn = document.getElementById('exportBtn');
        const exportStatus = document.getElementById('exportStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        function renderFrame() {
            if (isVideoLoaded && video.readyState >= 2) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const shiftX = (canvas.width - video.videoWidth * ratio) / 2;
                const shiftY = (canvas.height - video.videoHeight * ratio) / 2;
                
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight,
                             shiftX, shiftY, video.videoWidth * ratio, video.videoHeight * ratio);
            } else {
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#64748b";
                ctx.font = "36px 'Plus Jakarta Sans'";
                ctx.textAlign = "center";
                ctx.fillText("Upload video untuk memulai", canvas.width / 2, canvas.height / 2);
            }

            // Watermark Drawing
            ctx.save();
            ctx.globalAlpha = watermark.opacity;

            if (watermark.type === 'text') {
                ctx.font = `bold ${watermark.size}px '${watermark.font}'`;
                ctx.fillStyle = watermark.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                ctx.fillText(watermark.text, watermark.x, watermark.y);
            } else if (watermark.type === 'image' && watermark.image) {
                const img = watermark.image;
                const aspect = img.width / img.height;
                const width = watermark.size * 3.5;
                const height = width / aspect;
                ctx.drawImage(img, watermark.x - width/2, watermark.y - height/2, width, height);
            }
            ctx.restore();
        }

        function previewLoop() {
            if (!video.paused && !video.ended && !isExporting) {
                renderFrame();
                requestAnimationFrame(previewLoop);
            }
        }

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('videoLabel').innerText = file.name.substring(0, 20) + '...';
                video.src = URL.createObjectURL(file);
                video.onloadeddata = () => {
                    isVideoLoaded = true;
                    playPauseBtn.disabled = false;
                    exportBtn.disabled = false;
                    renderFrame();
                };
            }
        });

        watermarkType.addEventListener('change', (e) => {
            watermark.type = e.target.value;
            textControls.style.display = watermark.type === 'text' ? 'block' : 'none';
            imageControls.style.display = watermark.type === 'image' ? 'block' : 'none';
            renderFrame();
        });

        wmText.addEventListener('input', (e) => { watermark.text = e.target.value; renderFrame(); });
        wmFont.addEventListener('change', (e) => { watermark.font = e.target.value; renderFrame(); });
        wmColor.addEventListener('input', (e) => { watermark.color = e.target.value; renderFrame(); });
        wmSize.addEventListener('input', (e) => { 
            watermark.size = parseInt(e.target.value); 
            document.getElementById('sizeValue').innerText = watermark.size;
            renderFrame(); 
        });
        wmOpacity.addEventListener('input', (e) => { 
            watermark.opacity = parseInt(e.target.value) / 100; 
            document.getElementById('opacityValue').innerText = e.target.value;
            renderFrame(); 
        });

        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('logoLabel').innerText = file.name.substring(0, 15) + '...';
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    watermark.image = img;
                    renderFrame();
                };
            }
        });

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrag(e) { isDragging = true; moveWatermark(e); }
        function moveWatermark(e) {
            if (!isDragging || isExporting) return;
            const pos = getCanvasCoordinates(e);
            watermark.x = Math.max(0, Math.min(canvas.width, pos.x));
            watermark.y = Math.max(0, Math.min(canvas.height, pos.y));
            if (video.paused) renderFrame();
        }
        function stopDrag() { isDragging = false; }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveWatermark);
        window.addEventListener('mouseup', stopDrag);
        canvas.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', moveWatermark);
        window.addEventListener('touchend', stopDrag);

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerText = '⏸ Jeda';
                previewLoop();
            } else {
                video.pause();
                playPauseBtn.innerText = '▶ Putar Preview';
            }
        });

        // FAST EXPORT dengan High-Bitrate (8 Mbps)
        exportBtn.addEventListener('click', async () => {
            if (!isVideoLoaded || isExporting) return;

            isExporting = true;
            video.pause();
            playPauseBtn.disabled = true;
            exportBtn.disabled = true;
            progressContainer.style.display = 'block';
            exportStatus.innerText = "Memproses video berkecepatan tinggi...";

            // Menjalankan video dengan kecepatan playback maksimal yang didukung browser (2x-4x)
            video.playbackRate = 4.0;
            video.currentTime = 0;

            const stream = canvas.captureStream(30);
            const recordedChunks = [];
            
            // Set bitrate tinggi (8 Mbps) agar hasil Full HD tajam tanpa pecah
            const recorderOptions = {
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 8000000 
            };

            let recorder;
            try {
                recorder = new MediaRecorder(stream, recorderOptions);
            } catch (err) {
                recorder = new MediaRecorder(stream, { videoBitsPerSecond: 8000000 });
            }

            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            recorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `watermark_hd_${Date.now()}.mp4`;
                a.click();

                // Reset state
                video.playbackRate = 1.0;
                isExporting = false;
                exportBtn.disabled = false;
                playPauseBtn.disabled = false;
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
                exportStatus.innerText = "Selesai! Video berhasil diunduh.";
            };

            recorder.start();
            await video.play();

            // Render loop khusus ekspor
            function fastRender() {
                if (!video.ended && isExporting) {
                    renderFrame();
                    const progress = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = `${progress}%`;
                    exportStatus.innerText = `Memproses: ${Math.round(progress)}%`;
                    requestAnimationFrame(fastRender);
                } else if (video.ended) {
                    renderFrame();
                    progressBar.style.width = '100%';
                    recorder.stop();
                }
            }

            fastRender();
        });

        renderFrame();
    </script>
</body>
</html>
