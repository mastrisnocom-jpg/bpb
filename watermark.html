<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Watermark Studio 9:16</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Montserrat:wght@700&family=Playfair+Display:wght@700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #334155;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.25rem 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 1.5rem 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Panel Preview --- */
        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            width: 360px;
            height: 640px; /* Rasio 9:16 */
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #previewCanvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #previewCanvas:active {
            cursor: grabbing;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Control Sidebar --- */
        .controls-panel {
            width: 380px;
            background-color: var(--bg-panel);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border: 1px solid var(--border);
            overflow-y: auto;
            max-height: 80vh;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .custom-file-upload {
            border: 1px dashed var(--border);
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            background: rgba(51, 65, 85, 0.3);
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .custom-file-upload:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        input[type="file"] {
            display: none;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        input[type="range"] {
            accent-color: var(--accent);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        #exportStatus {
            font-size: 0.85rem;
            text-align: center;
            color: var(--accent);
            min-height: 1.2rem;
        }

        @media (max-width: 850px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .controls-panel {
                width: 100%;
                max-width: 360px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><span>✦</span> Watermark Studio (9:16)</h1>
    </header>

    <div class="container">
        <div class="preview-section">
            <div class="canvas-wrapper">
                <canvas id="previewCanvas" width="720" height="1280"></canvas>
            </div>
            <div class="hint">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                Klik & seret watermark di canvas untuk mengatur posisinya
            </div>
        </div>

        <div class="controls-panel">
            <div class="form-group">
                <div class="section-title">1. Sumber Video</div>
                <label class="custom-file-upload">
                    <span id="videoLabel">Pilih Video (MP4 / WebM)</span>
                    <input type="file" id="videoInput" accept="video/*">
                </label>
            </div>

            <div class="form-group">
                <div class="section-title">2. Pengaturan Watermark</div>
                <label>Tipe Watermark</label>
                <select id="watermarkType">
                    <option value="text">Teks</option>
                    <option value="image">Gambar / Logo</option>
                </select>
            </div>

            <div id="textControls">
                <div class="form-group">
                    <label>Teks Watermark</label>
                    <input type="text" id="wmText" value="@username_anda">
                </div>
                <div class="grid-2" style="margin-top:0.75rem;">
                    <div class="form-group">
                        <label>Font</label>
                        <select id="wmFont">
                            <option value="Plus Jakarta Sans">Jakarta Sans</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Playfair Display">Playfair</option>
                            <option value="Roboto Mono">Mono</option>
                            <option value="Arial">Arial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Warna Teks</label>
                        <input type="color" id="wmColor" value="#ffffff">
                    </div>
                </div>
            </div>

            <div id="imageControls" style="display: none;">
                <div class="form-group">
                    <label>Upload Logo (PNG Transparan)</label>
                    <label class="custom-file-upload">
                        <span id="logoLabel">Pilih File Logo</span>
                        <input type="file" id="logoInput" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="form-group" style="margin-top:0.5rem;">
                <label>Ukuran: <span id="sizeValue">36</span>px</label>
                <input type="range" id="wmSize" min="16" max="150" value="36">
            </div>

            <div class="form-group">
                <label>Transparansi (Opasitas): <span id="opacityValue">80</span>%</label>
                <input type="range" id="wmOpacity" min="10" max="100" value="80">
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" id="playPauseBtn" disabled>▶ Putar Preview</button>
                <button class="btn" id="exportBtn" disabled>💾 Proses & Download Video</button>
                <div id="exportStatus"></div>
            </div>
        </div>
    </div>

    <video id="sourceVideo" style="display: none;" playsinline loop muted></video>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('sourceVideo');

        // State Watermark
        let watermark = {
            type: 'text',
            text: '@username_anda',
            font: 'Plus Jakarta Sans',
            color: '#ffffff',
            x: 360, 
            y: 120, // Default dekat bagian atas
            size: 36,
            opacity: 0.8,
            image: null
        };

        let isDragging = false;
        let isVideoLoaded = false;
        let mediaRecorder;
        let recordedChunks = [];

        // Elements
        const videoInput = document.getElementById('videoInput');
        const logoInput = document.getElementById('logoInput');
        const watermarkType = document.getElementById('watermarkType');
        const textControls = document.getElementById('textControls');
        const imageControls = document.getElementById('imageControls');
        const wmText = document.getElementById('wmText');
        const wmFont = document.getElementById('wmFont');
        const wmColor = document.getElementById('wmColor');
        const wmSize = document.getElementById('wmSize');
        const wmOpacity = document.getElementById('wmOpacity');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const exportBtn = document.getElementById('exportBtn');
        const exportStatus = document.getElementById('exportStatus');

        // Render Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Video / Background
            if (isVideoLoaded && video.readyState >= 2) {
                // Menyesuaikan rasio pengisian video 9:16
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const centerShiftX = (canvas.width - video.videoWidth * ratio) / 2;
                const centerShiftY = (canvas.height - video.videoHeight * ratio) / 2;
                
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight,
                             centerShiftX, centerShiftY, video.videoWidth * ratio, video.videoHeight * ratio);
            } else {
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#64748b";
                ctx.font = "24px 'Plus Jakarta Sans'";
                ctx.textAlign = "center";
                ctx.fillText("Upload video untuk memulai", canvas.width / 2, canvas.height / 2);
            }

            // 2. Render Watermark
            ctx.save();
            ctx.globalAlpha = watermark.opacity;

            if (watermark.type === 'text') {
                ctx.font = `bold ${watermark.size}px '${watermark.font}'`;
                ctx.fillStyle = watermark.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Tambahkan efek shadow tipis agar terbaca di segala latar
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 2;

                ctx.fillText(watermark.text, watermark.x, watermark.y);
            } else if (watermark.type === 'image' && watermark.image) {
                const img = watermark.image;
                const aspect = img.width / img.height;
                const width = watermark.size * 3;
                const height = width / aspect;
                
                ctx.drawImage(img, watermark.x - width/2, watermark.y - height/2, width, height);
            }
            ctx.restore();

            if (!video.paused && !video.ended) {
                requestAnimationFrame(draw);
            }
        }

        // Event: Upload Video
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('videoLabel').innerText = file.name.substring(0, 20) + '...';
                video.src = URL.createObjectURL(file);
                video.onloadeddata = () => {
                    isVideoLoaded = true;
                    playPauseBtn.disabled = false;
                    exportBtn.disabled = false;
                    draw();
                };
            }
        });

        // Event: Switch Tipe Watermark
        watermarkType.addEventListener('change', (e) => {
            watermark.type = e.target.value;
            if (watermark.type === 'text') {
                textControls.style.display = 'block';
                imageControls.style.display = 'none';
            } else {
                textControls.style.display = 'none';
                imageControls.style.display = 'block';
            }
            draw();
        });

        // Event: Update Form Teks & Styling
        wmText.addEventListener('input', (e) => { watermark.text = e.target.value; draw(); });
        wmFont.addEventListener('change', (e) => { watermark.font = e.target.value; draw(); });
        wmColor.addEventListener('input', (e) => { watermark.color = e.target.value; draw(); });
        
        wmSize.addEventListener('input', (e) => { 
            watermark.size = parseInt(e.target.value); 
            document.getElementById('sizeValue').innerText = watermark.size;
            draw(); 
        });

        wmOpacity.addEventListener('input', (e) => { 
            watermark.opacity = parseInt(e.target.value) / 100; 
            document.getElementById('opacityValue').innerText = e.target.value;
            draw(); 
        });

        // Event: Upload Logo
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('logoLabel').innerText = file.name.substring(0, 15) + '...';
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => {
                    watermark.image = img;
                    draw();
                };
            }
        });

        // Drag & Drop Watermark pada Canvas
        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrag(e) {
            isDragging = true;
            moveWatermark(e);
        }

        function moveWatermark(e) {
            if (!isDragging) return;
            const pos = getCanvasCoordinates(e);
            watermark.x = Math.max(0, Math.min(canvas.width, pos.x));
            watermark.y = Math.max(0, Math.min(canvas.height, pos.y));
            if (video.paused) draw();
        }

        function stopDrag() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveWatermark);
        window.addEventListener('mouseup', stopDrag);

        // Touch support untuk HP/Tablet
        canvas.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', moveWatermark);
        window.addEventListener('touchend', stopDrag);

        // Play / Pause
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playPauseBtn.innerText = '⏸ Jeda Preview';
                draw();
            } else {
                video.pause();
                playPauseBtn.innerText = '▶ Putar Preview';
            }
        });

        // Export/Download Video (Menggunakan MediaRecorder API)
        exportBtn.addEventListener('click', async () => {
            if (!isVideoLoaded) return;

            exportBtn.disabled = true;
            playPauseBtn.disabled = true;
            exportStatus.innerText = "Merekam & memproses video...";

            video.currentTime = 0;
            video.muted = false; // Memastikan audio ikut jika didukung
            await video.play();

            const stream = canvas.captureStream(30); // 30 FPS
            recordedChunks = [];
            
            // Konfigurasi Recorder
            const options = { mimeType: 'video/webm; codecs=vp9' };
            try {
                mediaRecorder = new MediaRecorder(stream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `watermarked_video_${Date.now()}.mp4`;
                a.click();
                
                exportStatus.innerText = "Selesai! File sedang diunduh.";
                exportBtn.disabled = false;
                playPauseBtn.disabled = false;
                playPauseBtn.innerText = '▶ Putar Preview';
                video.pause();
            };

            mediaRecorder.start();
            draw();

            video.onended = () => {
                mediaRecorder.stop();
            };
        });

        // Gambar state inisial
        draw();
    </script>
</body>
</html>
