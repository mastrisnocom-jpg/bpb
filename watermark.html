<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Editor Watermark & Auto Subtitle 9:16 Responsif</title>
    <meta name="description" content="Aplikasi web editor video vertikal 9:16 online untuk menambahkan watermark kustom dan transkripsi subtitle suara manusia otomatis tanpa menghilangkan audio.">
    <meta name="keywords" content="watermark video, subtitle otomatis video, editor video 9:16, convert video mobile">
    <meta name="robots" content="index, follow">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Montserrat:wght@700;900&family=Roboto+Mono:wght@600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0b1120;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --accent: #f59e0b;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 2rem;
        }

        header {
            padding: 1rem 1.25rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            text-align: center;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        @media (min-width: 860px) {
            .main-wrapper {
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                gap: 2rem;
            }
        }

        /* --- Area Layar HP 9:16 --- */
        .stage-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 340px;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 0 2px var(--border);
        }

        #videoCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: grab;
        }

        #videoCanvas:active {
            cursor: grabbing;
        }

        .phone-hint {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 0.6rem;
            text-align: center;
        }

        /* --- Panel Pengaturan --- */
        .settings-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.25rem;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .group-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--primary);
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.35rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.65rem 0.85rem;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .upload-box {
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 0.85rem;
            text-align: center;
            cursor: pointer;
            background: rgba(56, 189, 248, 0.05);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        input[type="file"] { display: none; }
        input[type="color"] { border: none; width: 100%; height: 38px; border-radius: 8px; background: transparent; cursor: pointer; }
        input[type="range"] { accent-color: var(--primary); width: 100%; }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--primary);
        }

        /* Buttons */
        .btn {
            background-color: var(--primary);
            color: #0b1120;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .progress-box {
            width: 100%;
            height: 8px;
            background: var(--bg-input);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        #statusText {
            font-size: 0.8rem;
            text-align: center;
            color: var(--primary);
            min-height: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>✦ Studio Watermark & Subtitle 9:16</h1>
    </header>

    <main class="main-wrapper">
        <section class="stage-area">
            <div class="phone-frame">
                <canvas id="videoCanvas" width="1080" height="1920"></canvas>
            </div>
            <p class="phone-hint">👆 Sentuh dan geser teks watermark di layar</p>
        </section>

        <section class="settings-card">
            
            <div class="group-title">1. Unggah Media</div>
            <label class="upload-box">
                <span id="videoStatusLabel">📹 Pilih Video Asli</span>
                <input type="file" id="videoFile" accept="video/*">
            </label>

            <div class="group-title">2. Kustomisasi Watermark</div>
            
            <div class="field">
                <label>Tipe Watermark</label>
                <select id="wmType">
                    <option value="text">Teks</option>
                    <option value="logo">Logo / Gambar</option>
                </select>
            </div>

            <div id="textSetting">
                <div class="field">
                    <label>Teks Watermark</label>
                    <input type="text" id="wmText" value="@nama_kamu">
                </div>
                <div class="row-2" style="margin-top: 0.5rem;">
                    <div class="field">
                        <label>Pilihan Font</label>
                        <select id="wmFont">
                            <option value="Plus Jakarta Sans">Jakarta Sans</option>
                            <option value="Montserrat">Montserrat</option>
                            <option value="Roboto Mono">Mono</option>
                            <option value="Arial">Arial</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Warna Teks</label>
                        <input type="color" id="wmColor" value="#ffffff">
                    </div>
                </div>
            </div>

            <div id="logoSetting" style="display:none;">
                <label class="upload-box">
                    <span id="logoStatusLabel">🖼 Pilih Logo (PNG)</span>
                    <input type="file" id="logoFile" accept="image/*">
                </label>
            </div>

            <div class="row-2">
                <div class="field">
                    <label>Ukuran: <span id="valSize">60</span>px</label>
                    <input type="range" id="wmSize" min="20" max="180" value="60">
                </div>
                <div class="field">
                    <label>Transparansi: <span id="valOpacity">90</span>%</label>
                    <input type="range" id="wmOpacity" min="10" max="100" value="90">
                </div>
            </div>

            <div class="group-title">3. Subtitle Suara Manusia (AI)</div>
            <label class="checkbox-container">
                <input type="checkbox" id="autoSubtitleCheck" checked>
                <span>Aktifkan Subtitle Teks Suara Manusia</span>
            </label>

            <div style="display:flex; flex-direction:column; gap:0.6rem; margin-top:0.4rem;">
                <button type="button" class="btn btn-outline" id="playBtn" disabled>▶ Putar Preview Video</button>
                <button type="button" class="btn" id="exportBtn" disabled>⚡ Download Video & Suara Asli</button>
                <div class="progress-box" id="pBox"><div class="progress-bar" id="pBar"></div></div>
                <div id="statusText"></div>
            </div>

        </section>
    </main>

    <video id="rawVideo" style="display:none;" playsinline crossorigin="anonymous"></video>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('rawVideo');

        // State Watermark & Subtitle
        let watermark = {
            type: 'text',
            text: '@nama_kamu',
            font: 'Plus Jakarta Sans',
            color: '#ffffff',
            x: 540,
            y: 200, // Posisi atas
            size: 60,
            opacity: 0.9,
            logoImg: null
        };

        let currentSubtitle = "";
        let isDragging = false;
        let isExporting = false;
        let speechRecognizer = null;

        // UI Selectors
        const videoFile = document.getElementById('videoFile');
        const logoFile = document.getElementById('logoFile');
        const wmType = document.getElementById('wmType');
        const textSetting = document.getElementById('textSetting');
        const logoSetting = document.getElementById('logoSetting');
        const wmText = document.getElementById('wmText');
        const wmFont = document.getElementById('wmFont');
        const wmColor = document.getElementById('wmColor');
        const wmSize = document.getElementById('wmSize');
        const wmOpacity = document.getElementById('wmOpacity');
        const autoSubtitleCheck = document.getElementById('autoSubtitleCheck');
        const playBtn = document.getElementById('playBtn');
        const exportBtn = document.getElementById('exportBtn');
        const statusText = document.getElementById('statusText');
        const pBox = document.getElementById('pBox');
        const pBar = document.getElementById('pBar');

        // Setup AI Speech Recognition (Deteksi Suara Manusia)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognizer = new SpeechRecognition();
            speechRecognizer.continuous = true;
            speechRecognizer.interimResults = true;
            speechRecognizer.lang = 'id-ID';

            speechRecognizer.onresult = (event) => {
                let text = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    text += event.results[i][0].transcript;
                }
                currentSubtitle = text;
                if (video.paused) render();
            };
        }

        // Render Frame Canvas (Video Utuh Tanpa Terpotong)
        function render() {
            // Latar Belakang Hitam Pekat
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (video.readyState >= 2) {
                // LOGIKA "CONTAIN / FIT": Seluruh frame video asli masuk tanpa ter-crop
                const scale = Math.min(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
                const drawWidth = video.videoWidth * scale;
                const drawHeight = video.videoHeight * scale;
                const drawX = (canvas.width - drawWidth) / 2;
                const drawY = (canvas.height - drawHeight) / 2;

                ctx.drawImage(video, drawX, drawY, drawWidth, drawHeight);
            } else {
                ctx.fillStyle = "#64748b";
                ctx.font = "bold 40px 'Plus Jakarta Sans'";
                ctx.textAlign = "center";
                ctx.fillText("Upload video untuk memulai", 540, 960);
            }

            // Render Watermark
            ctx.save();
            ctx.globalAlpha = watermark.opacity;
            if (watermark.type === 'text') {
                ctx.font = `bold ${watermark.size}px '${watermark.font}'`;
                ctx.fillStyle = watermark.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 12;
                ctx.fillText(watermark.text, watermark.x, watermark.y);
            } else if (watermark.type === 'logo' && watermark.logoImg) {
                const aspect = watermark.logoImg.width / watermark.logoImg.height;
                const w = watermark.size * 3.5;
                const h = w / aspect;
                ctx.drawImage(watermark.logoImg, watermark.x - w/2, watermark.y - h/2, w, h);
            }
            ctx.restore();

            // Render Subtitle Suara Manusia (Jika Aktif dan Ada Ucapan)
            if (autoSubtitleCheck.checked && currentSubtitle.trim() !== "") {
                ctx.save();
                ctx.font = "bold 44px 'Plus Jakarta Sans'";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";

                const subX = 540;
                const subY = 1750; // Posisi bawah layar handphone
                const textWidth = ctx.measureText(currentSubtitle).width;

                // Box Background Teks Subtitle
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.roundRect ? ctx.roundRect(subX - textWidth/2 - 24, subY - 56, textWidth + 48, 64, 12) : 
                                ctx.fillRect(subX - textWidth/2 - 24, subY - 56, textWidth + 48, 64);
                ctx.fill();

                // Teks Subtitle Kuning Kontras
                ctx.fillStyle = "#fde047";
                ctx.fillText(currentSubtitle, subX, subY - 8);
                ctx.restore();
            }
        }

        function animLoop() {
            if (!video.paused && !video.ended && !isExporting) {
                render();
                requestAnimationFrame(animLoop);
            }
        }

        // Upload Video
        videoFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('videoStatusLabel').innerText = file.name.substring(0, 22) + "...";
                video.src = URL.createObjectURL(file);
                video.onloadeddata = () => {
                    playBtn.disabled = false;
                    exportBtn.disabled = false;
                    render();
                };
            }
        });

        // Toggle Type
        wmType.addEventListener('change', (e) => {
            watermark.type = e.target.value;
            textSetting.style.display = watermark.type === 'text' ? 'block' : 'none';
            logoSetting.style.display = watermark.type === 'logo' ? 'block' : 'none';
            render();
        });

        // Kontrol Input
        wmText.addEventListener('input', (e) => { watermark.text = e.target.value; render(); });
        wmFont.addEventListener('change', (e) => { watermark.font = e.target.value; render(); });
        wmColor.addEventListener('input', (e) => { watermark.color = e.target.value; render(); });
        wmSize.addEventListener('input', (e) => { 
            watermark.size = parseInt(e.target.value); 
            document.getElementById('valSize').innerText = watermark.size;
            render(); 
        });
        wmOpacity.addEventListener('input', (e) => { 
            watermark.opacity = parseInt(e.target.value) / 100; 
            document.getElementById('valOpacity').innerText = e.target.value;
            render(); 
        });

        logoFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('logoStatusLabel').innerText = file.name.substring(0, 18);
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = () => { watermark.logoImg = img; render(); };
            }
        });

        // Drag & Drop Posisi Watermark
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
        }

        canvas.addEventListener('mousedown', (e) => { isDragging = true; updatePos(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging && !isExporting) updatePos(e); });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => { isDragging = true; updatePos(e); }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (isDragging && !isExporting) updatePos(e); }, { passive: true });
        window.addEventListener('touchend', () => isDragging = false);

        function updatePos(e) {
            const pos = getCanvasCoords(e);
            watermark.x = Math.max(50, Math.min(canvas.width - 50, pos.x));
            watermark.y = Math.max(50, Math.min(canvas.height - 50, pos.y));
            if (video.paused) render();
        }

        // Preview Play / Pause
        playBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                playBtn.innerText = "⏸ Jeda Preview";
                if (speechRecognizer && autoSubtitleCheck.checked) {
                    try { speechRecognizer.start(); } catch(e){}
                }
                animLoop();
            } else {
                video.pause();
                playBtn.innerText = "▶ Putar Preview Video";
                if (speechRecognizer) {
                    try { speechRecognizer.stop(); } catch(e){}
                }
            }
        });

        // Ekspor Video + Mempertahankan Audio Asli
        exportBtn.addEventListener('click', async () => {
            if (isExporting) return;
            isExporting = true;

            video.pause();
            playBtn.disabled = true;
            exportBtn.disabled = true;
            pBox.style.display = 'block';
            statusText.innerText = "Memproses video & menyatukan audio asli...";

            // Setup Web Audio API untuk mempertahankan suara asli 100%
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioSource = audioCtx.createMediaElementSource(video);
            const audioDestination = audioCtx.createMediaStreamDestination();
            audioSource.connect(audioDestination);
            audioSource.connect(audioCtx.destination); // Ke speaker saat render

            const canvasStream = canvas.captureStream(30);
            
            // Gabungkan video stream canvas + audio stream asli
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioDestination.stream.getAudioTracks()
            ]);

            const chunks = [];
            const recorder = new MediaRecorder(combinedStream, {
                mimeType: 'video/webm; codecs=vp8,opus',
                videoBitsPerSecond: 8000000 // 8 Mbps HD
            });

            recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `video_watermark_${Date.now()}.mp4`;
                a.click();

                isExporting = false;
                playBtn.disabled = false;
                exportBtn.disabled = false;
                pBox.style.display = 'none';
                statusText.innerText = "✓ Selesai! Video berhasil diunduh.";
            };

            recorder.start();
            video.currentTime = 0;
            await video.play();

            function exportLoop() {
                if (!video.ended && isExporting) {
                    render();
                    const prog = (video.currentTime / video.duration) * 100;
                    pBar.style.width = `${prog}%`;
                    statusText.innerText = `Menyimpan: ${Math.round(prog)}%`;
                    requestAnimationFrame(exportLoop);
                } else if (video.ended) {
                    render();
                    pBar.style.width = '100%';
                    recorder.stop();
                }
            }

            exportLoop();
        });

        // Inisialisasi Layar Pertama
        render();
    </script>
</body>
</html>
