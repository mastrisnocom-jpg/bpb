<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevenLabs Voice Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-top: 0; color: #38bdf8; }
        label { font-size: 13px; font-weight: bold; margin-top: 14px; display: block; }
        input, textarea, select, button {
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
            border-radius: 8px;
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 10px;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            margin-top: 18px;
            background: #0284c7;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0369a1; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #475569;
            display: none;
            text-align: center;
        }
        audio { width: 100%; margin-top: 10px; }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>ElevenLabs Voice AI</h2>
    
    <label for="apiKey">ElevenLabs API Key:</label>
    <input type="password" id="apiKey" placeholder="xi-api-key...">
    
    <label for="textInput">Teks (Mendukung Bahasa Indonesia):</label>
    <textarea id="textInput" rows="4" placeholder="Ketik kalimat yang ingin diubah menjadi suara..."></textarea>
    
    <label for="voiceSelect">Pilih Model Suara:</label>
    <select id="voiceSelect">
        <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Wanita - Tenang & Ramah)</option>
        <option value="ErXwobaYiN019PkySvjV">Antoni (Pria - Narasi/Jelas)</option>
        <option value="EXAVITQu4vr4xnSDxMaL">Bella (Wanita - Lembut)</option>
        <option value="pNInz6obpgDQGcFmaJgB">Adam (Pria - Dalam/Formal)</option>
    </select>
    
    <button id="generateBtn" onclick="generateVoice()">✨ Generate Suara</button>

    <div class="result-box" id="resultBox">
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink" class="download-btn" download="elevenlabs_audio.mp3">⬇ Download File MP3</a>
    </div>
</div>

<script>
    async function generateVoice() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const text = document.getElementById('textInput').value.trim();
        const voiceId = document.getElementById('voiceSelect').value;
        const btn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');

        if (!apiKey) return alert('Silakan masukkan ElevenLabs API Key terlebih dahulu!');
        if (!text) return alert('Silakan masukkan teks!');

        btn.disabled = true;
        btn.innerText = 'Sedang Memproses AI...';

        try {
            // Memanggil Endpoint Text-to-Speech ElevenLabs
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'xi-api-key': apiKey,
                    'Accept': 'audio/mpeg'
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_multilingual_v2", // Mendukung Bahasa Indonesia dengan sangat baik
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail?.message || 'Gagal memproses ke ElevenLabs. Cek API Key/Kuota Anda.');
            }

            // Mengonversi respons audio binary menjadi URL pemutaran
            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);

            audioPlayer.src = audioUrl;
            downloadLink.href = audioUrl;
            resultBox.style.display = 'block';
            audioPlayer.play();

        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '✨ Generate Suara';
        }
    }
</script>

</body>
</html>
