<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Voice Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 { text-align: center; margin-top: 0; color: #60a5fa; }
        label { font-size: 13px; font-weight: 600; margin-top: 14px; display: block; color: #94a3b8; }
        input, textarea, select, button {
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
        }
        button {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            display: none;
            text-align: center;
        }
        audio { width: 100%; margin-top: 10px; }
        .download-btn {
            display: inline-block;
            margin-top: 12px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>OpenRouter Voice Web</h2>
    
    <label for="apiKey">OpenRouter API Key:</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-...">

    <label for="modelSelect">Pilih Model:</label>
    <select id="modelSelect">
        <option value="deepgram/flux-tts:free">Deepgram: Flux TTS (Free)</option>
        <option value="openai/gpt-4o-mini-tts-2025-12-15">OpenAI GPT-4o Mini TTS</option>
        <option value="x-ai/grok-voice-tts-1.0">xAI Grok Voice</option>
    </select>
    
    <label for="textInput">Teks yang Ingin Diucapkan:</label>
    <textarea id="textInput" rows="4" placeholder="Ketik kalimat di sini..."></textarea>
    
    <button id="generateBtn" onclick="generateAudio()">🔊 Generate Suara</button>

    <div class="result-box" id="resultBox">
        <h4>Hasil Audio:</h4>
        <audio id="audioPlayer" controls></audio>
        <br>
        <a id="downloadLink" class="download-btn" download="openrouter_audio.mp3">⬇ Download MP3</a>
    </div>
</div>

<script>
    // Memuat API Key otomatis jika sebelumnya tersimpan
    window.onload = () => {
        const savedKey = localStorage.getItem('openrouter_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    async function generateAudio() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelSelect').value;
        const text = document.getElementById('textInput').value.trim();
        const btn = document.getElementById('generateBtn');
        const resultBox = document.getElementById('resultBox');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');

        if (!apiKey) return alert('Masukkan OpenRouter API Key terlebih dahulu!');
        if (!text) return alert('Masukkan teks yang ingin diubah ke suara!');

        // Simpan API Key di browser agar tidak perlu input ulang
        localStorage.setItem('openrouter_key', apiKey);

        btn.disabled = true;
        btn.innerText = 'Memproses Audio via OpenRouter...';

        // Tentukan default voice sesuai model
        let voice = "alloy";
        if (model.includes("deepgram")) voice = "flux-alexis-en";
        if (model.includes("grok")) voice = "ara";

        try {
            const response = await fetch('https://openrouter.ai/api/v1/audio/speech', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': window.location.origin,
                    'X-Title': 'Voice WebApp'
                },
                body: JSON.stringify({
                    model: model,
                    input: text,
                    voice: voice,
                    response_format: 'mp3'
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || 'Gagal memproses audio dari OpenRouter.');
            }

            // Menerima data stream biner audio dan membuat URL
            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);

            audioPlayer.src = audioUrl;
            downloadLink.href = audioUrl;
            resultBox.style.display = 'block';
            audioPlayer.play();

        } catch (error) {
            alert('Error: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '🔊 Generate Suara';
        }
    }
</script>

</body>
</html>
