<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi SPA LocalStorage</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .page { display: none; } /* Semua halaman tersembunyi secara default */
    .active { display: block; } /* Halaman aktif ditampilkan */
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
    button { padding: 8px 16px; margin-top: 10px; cursor: pointer; }
    input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  </style>
</head>
<body>

  <!-- 1. LANDING PAGE -->
  <div id="landingPage" class="page">
    <h1>Selamat Datang di Website Kami</h1>
    <p>Ini adalah halaman informasi tentang website kami sebelum Anda masuk ke sistem.</p>
    <button onclick="navigateTo('loginPage')">Masuk / Login</button>
  </div>

  <!-- 2. LOGIN PAGE -->
  <div id="loginPage" class="page">
    <div class="card">
      <h2>Halaman Login</h2>
      <form id="loginForm">
        <label>Username:</label>
        <input type="text" id="username" required placeholder="Masukkan username">
        <label>Password:</label>
        <input type="password" id="password" required placeholder="Masukkan password">
        <button type="submit">Login</button>
      </form>
      <br>
      <small><a href="#" onclick="navigateTo('landingPage')">← Kembali ke Landing Page</a></small>
    </div>
  </div>

  <!-- 3. DASHBOARD PAGE (PROTECTED) -->
  <div id="dashboardPage" class="page">
    <h1>Dashboard Utama</h1>
    <p>Selamat datang, <b id="userDisplay"></b>!</p>
    <p>Anda berhasil mengakses halaman area terbatas.</p>
    <button onclick="handleLogout()">Logout</button>
  </div>

  <script>
    // Fungsi untuk navigasi antar halaman
    function navigateTo(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
    }

    // Cek Status Login saat halaman pertama kali di-load
    function checkAuth() {
      const session = JSON.parse(localStorage.getItem('user_session'));
      
      if (session && session.isLoggedIn) {
        // Jika sudah login, langsung ke Dashboard
        document.getElementById('userDisplay').innerText = session.username;
        navigateTo('dashboardPage');
      } else {
        // Jika belum login, tampilkan Landing Page
        navigateTo('landingPage');
      }
    }

    // Handle Form Login Submit
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value;

      // Simpan data ke localStorage
      const userData = {
        username: usernameInput,
        isLoggedIn: true,
        loginAt: new Date().toISOString()
      };
      localStorage.setItem('user_session', JSON.stringify(userData));

      // Update UI dan pindah ke Dashboard
      document.getElementById('userDisplay').innerText = usernameInput;
      navigateTo('dashboardPage');
    });

    // Handle Logout
    function handleLogout() {
      localStorage.removeItem('user_session');
      document.getElementById('loginForm').reset();
      navigateTo('landingPage');
    }

    // Jalankan pengecekan auth saat skrip berjalan
    checkAuth();
  </script>
</body>
</html>
